name: Team Registry Tests

# §1.2: workflow_dispatch only, no push/pull_request triggers
on:
  workflow_dispatch:

permissions:
  contents: read # Least privilege по правилу экосистемы §1.10

# §16.4: каноническая группа диагностического слоя
concurrency:
  group: gatekeeper-diagnostics
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Architecture & Mathematical Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Принудительно разворачиваем математическое ядро, используемое в контрактах
          pip install numpy scipy jsonschema

      - name: Check Compiler Syntax
        run: |
          python -m py_compile team_registry.py
          echo "✅ Syntax OK"

      - name: Run Gluing Contract Tests
        run: python test_gluing.py
        
