name: Team Registry Tests

on:
  push:
    paths:
      - 'team_registry.py'
      - 'test_gluing.py'
  pull_request:
    paths:
      - 'team_registry.py'
      - 'test_gluing.py'

permissions:
  contents: read # Least privilege по правилу экосистемы §1.10

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Гарантирует изоляцию прогона матрицы до конца при локальных сбоях версий
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Автоматическое кэширование зависимостей для ускорения тасков

      - name: Install Architecture & Mathematical Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Принудительно разворачиваем математическое ядро, используемое в контрактах
          pip install numpy scipy jsonschema

      - name: Check Compiler Syntax
        run: |
          python -m py_compile team_registry.py
          echo "✅ Syntax OK"

      - name: Run Gluing Contract Tests
        run: python test_gluing.py
        
