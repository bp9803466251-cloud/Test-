name: Backtest

# Tight-coupled-v9.3: Симуляция на history:match:* с temporal cutoff
# §1.2: workflow_dispatch only, no cron
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Сезоны через запятую (пусто = все в Redis)'
        required: false
        default: ''
      leagues:
        description: 'Лиги через запятую (пусто = все 22)'
        required: false
        default: ''
      window_size:
        description: 'Размер скользящего окна для drift detection (по умолчанию 50)'
        required: false
        default: '50'
      limit:
        description: 'Лимит матчей (0 = все)'
        required: false
        default: '0'
      dry_run:
        description: 'Только отчёт, без сохранения в Redis'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# §16.4: каноническая группа pipeline-слоя
concurrency:
  group: gatekeeper-pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  GATEKEEPER_CONFIG_FILE: 'gatekeeper_config.yaml' # Единая системная константа конфигурации

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      GATEKEEPER_ENV: backtest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Mathematics & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install numpy scipy pyyaml

      - name: Run backtest
        run: |
          ARGS=""
          SEASONS="${{ github.event.inputs.seasons || '' }}"
          LEAGUES="${{ github.event.inputs.leagues || '' }}"
          WINDOW="${{ github.event.inputs.window_size || '50' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"

          if [ -n "$SEASONS" ]; then ARGS="$ARGS --seasons $SEASONS"; fi
          if [ -n "$LEAGUES" ]; then ARGS="$ARGS --leagues $LEAGUES"; fi
          ARGS="$ARGS --window $WINDOW --limit $LIMIT"

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "=== Backtest arguments: $ARGS ==="
          python backtest_runner.py $ARGS

      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest_report.json
          retention-days: 30

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '' }}
        run: |
          MSG="🔴 Backtest FAILED%0ARepo: ${{ github.repository }}%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="${MSG}"

      - name: Telegram summary on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || 'MOCK_TOKEN' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_ID || 'MOCK_CHAT_ID' }}
        run: |
          python -c "
          import json
          import html as _html
          from telegram_transport import send_transport_payload

          try:
              with open('backtest_report.json', encoding='utf-8') as f:
                  report = json.load(f)
          except Exception:
              report = {}

          error = report.get('error')
          if error:
              msg = ('⚠️ Backtest: отчёт с ошибкой\n'
                     f'Причина: {_html.escape(str(error))}\n'
                     'Brier/RPS не вычислялись — исторических данных в Redis нет')
          elif report.get('total_matches', 0) == 0:
              msg = '⚠️ Backtest: обработано 0 матчей — метрики не вычислялись'
          else:
              total = report.get('total_matches', 0)
              hot = report.get('hot_count', 0)
              warm = report.get('warm_count', 0)
              brier = report.get('avg_brier')
              rps = report.get('avg_rps')
              drift = (report.get('drift') or {}).get('drift_flags', 0)
              calibrated = report.get('calibration_status', 'unknown')
              metrics = ('нет данных' if brier is None else f'Brier: {brier:.4f} | RPS: {rps:.4f}')
              msg = ('📊 Backtest Complete\n'
                     f'Matches: {total}\n'
                     f'HOT: {hot} | WARM: {warm}\n'
                     f'{metrics}\n'
                     f'Drift flags: {drift}\n'
                     f'Calibration: {calibrated}')

          if not send_transport_payload(msg):
              raise SystemExit(1)
          "
