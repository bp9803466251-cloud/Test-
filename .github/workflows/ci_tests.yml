name: CI Tests

# FIX-AUDIT-v9.3: push/pull_request → workflow_dispatch only (§1.2 — no auto triggers)
on:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read

concurrency:
  group: gatekeeper-redis
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GATEKEEPER_ENV: test
      GK_CONFIG_FILE: gatekeeper_config.yaml
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      VALUE_THRESHOLD: '0.03'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run contract tests
        run: |
          python test_contracts.py

      - name: Validate test fixtures (§20.8)
        run: |
          python -c "
          from test_fixtures import (
              CANONICAL_LIVE_MATCH,
              CANONICAL_HISTORY_MATCH,
              CANONICAL_COMPLETED_MATCH,
              CANONICAL_MINIMAL_MATCH,
              validate_fixtures,
          )
          from gatekeeper_hub import validate_schema

          for name, fixture in [
              ('CANONICAL_LIVE_MATCH', CANONICAL_LIVE_MATCH),
              ('CANONICAL_HISTORY_MATCH', CANONICAL_HISTORY_MATCH),
              ('CANONICAL_COMPLETED_MATCH', CANONICAL_COMPLETED_MATCH),
              ('CANONICAL_MINIMAL_MATCH', CANONICAL_MINIMAL_MATCH),
          ]:
              ok, msg = validate_schema(fixture)
              assert ok, f'{name} failed schema validation: {msg}'
              print(f'  {name}: OK')

          result = validate_fixtures()
          if isinstance(result, tuple):
              ok, errors = result
              assert ok, f'validate_fixtures failed: {errors}'
          else:
              assert result, 'validate_fixtures failed'
          print('All fixture validations passed')
          "

      - name: Syntax check all Python files
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | xargs -r -I{} python -m py_compile {}
          echo "All Python files compile successfully"

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          MESSAGE="🔴 CI Tests FAILED in ${{ github.repository }}"
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_GROUP_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" || true
