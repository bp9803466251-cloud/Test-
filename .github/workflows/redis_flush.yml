name: Redis Flush

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: history-only, soft, hard, purge, reset-breaker'
        required: true
        type: choice
        options:
          - history-only
          - soft
          - hard
          - purge
          - reset-breaker
        default: history-only
      confirm:
        description: 'Подтверждение'
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
      dry_run_only:
        description: 'Только превью (без выполнения)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: gatekeeper-redis
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHON_VERSION: '3.11'
      GK_CONFIG_FILE: gatekeeper_config.yaml
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set mode for manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "FLUSH_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          echo "FLUSH_CONFIRM=${{ github.event.inputs.confirm }}" >> $GITHUB_ENV
          echo "FLUSH_DRY_RUN=${{ github.event.inputs.dry_run_only }}" >> $GITHUB_ENV

      - name: Validate confirm
        run: |
          if [ "${FLUSH_CONFIRM}" != "yes" ]; then
            echo "ERROR: confirm must be 'yes'"
            exit 1
          fi
          echo "Confirm: OK"

      - name: Dry run (show plan)
        if: success()
        timeout-minutes: 15
        run: |
          MODE="${FLUSH_MODE}"
          echo "=== Redis Flush — Dry Run ==="
          echo "Mode: $MODE"
          case "$MODE" in
            history-only)
              HISTORY_FLUSH_CONFIRM=1 python redis_diagnostics.py --dry-run --history-only --yes
              ;;
            soft)
              python redis_diagnostics.py --dry-run --flush --yes
              ;;
            hard)
              python redis_diagnostics.py --dry-run --flush --hard --yes
              ;;
            purge)
              python redis_diagnostics.py --dry-run --purge --yes
              ;;
            reset-breaker)
              echo "Reset breaker — dry run not applicable"
              ;;
            *)
              echo "ERROR: Unknown mode '$MODE'"
              exit 1
              ;;
          esac

      - name: Stop if dry-run-only
        if: success() && env.FLUSH_DRY_RUN == 'true'
        run: |
          echo "=== Dry-run-only mode — skipping execution ==="
          exit 0

      - name: Execute flush
        if: success() && env.FLUSH_DRY_RUN != 'true'
        timeout-minutes: 20
        run: |
          MODE="${FLUSH_MODE}"
          echo "=== Redis Flush — Execute ==="
          echo "Mode: $MODE"
          case "$MODE" in
            history-only)
              HISTORY_FLUSH_CONFIRM=1 python redis_diagnostics.py --history-only --yes
              ;;
            soft)
              python redis_diagnostics.py --flush --yes
              ;;
            hard)
              python redis_diagnostics.py --flush --hard --yes
              ;;
            purge)
              python redis_diagnostics.py --purge --yes
              ;;
            reset-breaker)
              python redis_diagnostics.py --reset-breaker
              ;;
            *)
              echo "ERROR: Unknown mode '$MODE'"
              exit 1
              ;;
          esac

      - name: Verify after flush
        if: always() && env.FLUSH_MODE != 'reset-breaker'
        timeout-minutes: 10
        run: |
          echo "=== Post-Flush Verify ==="
          python redis_diagnostics.py

      - name: Summary
        if: always()
        run: |
          echo "=== Redis Flush Summary ==="
          echo "Mode: ${FLUSH_MODE}"
          echo "Confirm: ${FLUSH_CONFIRM}"
          echo "Dry run only: ${FLUSH_DRY_RUN}"
          echo ""
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram alert on failure
        if: failure()
        run: |
          MSG="❌ Redis Flush FAILED%0AMode: ${FLUSH_MODE}%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="${MSG}" || true
