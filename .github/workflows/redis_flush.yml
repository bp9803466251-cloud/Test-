name: Redis Flush

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: history-only, soft, hard, purge, reset-breaker'
        required: true
        type: choice
        options:
          - history-only
          - soft
          - hard
          - purge
          - reset-breaker
        default: history-only
      confirm:
        description: 'Подтверждение'
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
      dry_run_only:
        description: 'Только превью (без выполнения)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: redis-flush # [KEEP] Собственная группа была корректна — сохранена
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12' # [FIXED] 3.11 -> 3.12: синхрон с патч-циклом 9.6.8
  PYTHONUNBUFFERED: '1'

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Сетевой транспорт кэш-слоя Redis — полная лестница приоритетов §1.10
      # [FIXED] Добавлено среднее звено SHARED_REDIS_REST_*, отсутствовавшее в исходнике
      # [REMOVED] TELEGRAM_* из job-env: redis_flush.py Telegram не шлёт — это была
      # мёртвая экспозиция секретов на весь job; токен теперь только в шаге алерта
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      SHARED_REDIS_REST_URL: ${{ secrets.SHARED_REDIS_REST_URL || '' }}
      SHARED_REDIS_REST_TOKEN: ${{ secrets.SHARED_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      GATEKEEPER_CONFIG_FILE: 'gatekeeper_config.yaml' # Прямая передача строки без вызова ${{ env }}
      GATEKEEPER_ENV: production # [FIXED] prod -> production: синхрон с docker_compose.yml

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Mathematics & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # [REMOVED] Непривязанный "pip install numpy scipy": мог поднять numpy 2.x
          # поверх пина numpy<2.0.0 из патченного requirements (ABI-конфликт со scipy<1.14).
          # Версии уже зафиксированы в requirements.txt — второй установки не требуется.

      - name: Set mode for manual run
        env:
          # [FIXED] Инъекция закрыта: ручной ввод интерполируется только в env-блоке,
          # в run-скрипте — чтение из переменных окружения
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_CONFIRM: ${{ github.event.inputs.confirm }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run_only }}
        run: |
          echo "FLUSH_MODE=$IN_MODE" >> "$GITHUB_ENV"
          echo "FLUSH_CONFIRM=$IN_CONFIRM" >> "$GITHUB_ENV"
          echo "FLUSH_DRY_RUN=$IN_DRY_RUN" >> "$GITHUB_ENV"

      - name: Validate confirm
        run: |
          if [ "$FLUSH_CONFIRM" != "yes" ]; then
            echo "ERROR: confirm must be 'yes'"
            exit 1
          fi
          echo "Confirm: OK"

      - name: Dry run (show plan)
        if: success()
        timeout-minutes: 15
        run: |
          echo "=== Redis Flush - Dry Run ==="
          echo "Mode: $FLUSH_MODE"
          # -u: небуферизированный вывод в логи Actions
          python -u redis_flush.py --dry-run --mode "$FLUSH_MODE" --yes

      - name: Stop if dry-run-only
        if: success() && env.FLUSH_DRY_RUN == 'true'
        run: |
          echo "=== Dry-run-only mode - skipping execution ==="
          exit 0

      - name: Execute flush
        if: success() && env.FLUSH_DRY_RUN != 'true'
        timeout-minutes: 20
        run: |
          echo "=== Redis Flush - Execute ==="
          echo "Mode: $FLUSH_MODE"
          python -u redis_flush.py --mode "$FLUSH_MODE" --yes

      - name: Verify after flush
        if: always() && env.FLUSH_MODE != 'reset-breaker'
        timeout-minutes: 10
        run: |
          echo "=== Post-Flush Verify ==="
          python -u redis_flush.py --dry-run --mode soft --yes

      - name: Summary
        if: always()
        run: |
          echo "=== Redis Flush Summary ==="
          echo "Mode: $FLUSH_MODE"
          echo "Confirm: $FLUSH_CONFIRM"
          echo "Dry run only: $FLUSH_DRY_RUN"
          echo ""
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          FLUSH_MODE: ${{ env.FLUSH_MODE }}
        run: |
          # [FIXED] Битый URL -> канонический api.telegram.org/bot + sendMessage.
          # [FIXED] Убран || true: отказ доставки алерта должен быть виден в логе.
          # curl — системная утилита раннера, §1.3 регулирует Python-код пакета.
          MSG="❌ <b>Redis Flush FAILED</b>%0AMode: ${FLUSH_MODE}%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="${MSG}" \
            -d parse_mode="HTML"
            
