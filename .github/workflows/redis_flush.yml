name: Redis Flush v2.1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: history-only, soft, hard, purge, reset-breaker'
        required: true
        type: choice
        options:
          - history-only
          - soft
          - hard
          - purge
          - reset-breaker
        default: history-only
      confirm:
        description: 'Подтверждение'
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
      dry_run_only:
        description: 'Только превью (без выполнения)'
        type: boolean
        required: false
        default: false

concurrency:
  group: redis-flush
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Validate confirm
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "ERROR: confirm must be 'yes'"
            exit 1
          fi
          echo "Confirm: OK"

      - name: Dry run (show plan)
        if: success()
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 15
        run: |
          MODE="${{ github.event.inputs.mode }}"
          echo "=== Redis Flush v2.1 — Dry Run ==="
          echo "Mode: $MODE"
          echo ""

          case "$MODE" in
            history-only)
              python redis_diagnostics.py --dry-run --history-only --yes
              ;;
            soft)
              python redis_diagnostics.py --dry-run --flush --yes
              ;;
            hard)
              python redis_diagnostics.py --dry-run --flush --hard --yes
              ;;
            purge)
              python redis_diagnostics.py --dry-run --purge --yes
              ;;
            reset-breaker)
              echo "Reset breaker — dry run not applicable"
              echo "Will execute: --reset-breaker"
              ;;
            *)
              echo "ERROR: Unknown mode '$MODE'"
              exit 1
              ;;
          esac

      - name: Stop if dry-run-only
        if: success() && github.event.inputs.dry_run_only == 'true'
        run: |
          echo "=== Dry-run-only mode — skipping execution ==="
          echo "Review the plan above. Re-run with dry_run_only=false to execute."
          exit 0

      - name: Execute flush
        if: success() && github.event.inputs.dry_run_only != 'true'
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 20
        run: |
          MODE="${{ github.event.inputs.mode }}"
          echo "=== Redis Flush v2.1 — Execute ==="
          echo "Mode: $MODE"
          echo ""

          case "$MODE" in
            history-only)
              python redis_diagnostics.py --history-only --yes
              ;;
            soft)
              python redis_diagnostics.py --flush --yes
              ;;
            hard)
              python redis_diagnostics.py --flush --hard --yes
              ;;
            purge)
              python redis_diagnostics.py --purge --yes
              ;;
            reset-breaker)
              python redis_diagnostics.py --reset-breaker
              ;;
            *)
              echo "ERROR: Unknown mode '$MODE'"
              exit 1
              ;;
          esac

      - name: Verify after flush
        if: success() && github.event.inputs.mode != 'reset-breaker'
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 10
        run: |
          echo "=== Post-Flush Verify ==="
          python redis_diagnostics.py

      - name: Summary
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Redis Flush v2.1 Summary ==="
          echo "Mode: ${{ github.event.inputs.mode }}"
          echo "Confirm: ${{ github.event.inputs.confirm }}"
          echo "Dry run only: ${{ github.event.inputs.dry_run_only }}"
          echo ""
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          if [ "${{ job.status }}" = "success" ]; then
            echo "Status: SUCCESS"
          else
            echo "Status: ${{ job.status }}"
          fi
          
