name: Redis Flush

# WRITE-контур Redis (деструктивное обслуживание). Не входит в диагностику:
# отдельная группа redis-flush — write-операция не должна стоять в очереди
# за read-only прогонами (§16.4, решение аудита 10.0.0).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: history-only, soft, hard, purge (TOTAL WIPE — все ключи + все поля хэша), reset-breaker'
        required: true
        type: choice
        options:
          - history-only
          - soft
          - hard
          - purge
          - reset-breaker
        default: history-only
      confirm:
        description: 'Подтверждение'
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
      dry_run_only:
        description: 'Только превью (без выполнения)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: redis-flush
  cancel-in-progress: false

env:
  # [10.0.0] §1.10: единый интерпретатор — 3.11 (канон, см. guide-delta)
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Дефолты для контекстов env.* в if-условиях: линтер видит переменную,
      # а GITHUB_ENV-записи шага "Set mode" переопределяют их на рантайме
      FLUSH_MODE: 'history-only'
      FLUSH_CONFIRM: 'no'
      FLUSH_DRY_RUN: 'false'
      # [10.0.0] TELEGRAM_* из job-env убраны: flush не шлёт сам — только алерт шага
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      SHARED_REDIS_REST_URL: ${{ secrets.SHARED_REDIS_REST_URL || '' }}
      SHARED_REDIS_REST_TOKEN: ${{ secrets.SHARED_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      GATEKEEPER_CONFIG_FILE: 'gatekeeper_config.yaml'
      GATEKEEPER_ENV: production
      # [10.0.0 FIX #78] Таймаут транспорта 15 с: HSCAN-страницы легаси-хэша
      # (9925 полей) не помещаются в дефолтные 6 с — Upstash местами медленный
      GATEKEEPER_REDIS_TIMEOUT: '15'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Mathematics & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set mode for manual run
        env:
          # [FIXED 9.6.6, сохранён] Инъекция закрыта: ввод — только в env-блоке
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_CONFIRM: ${{ github.event.inputs.confirm }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run_only }}
        run: |
          echo "FLUSH_MODE=$IN_MODE" >> "$GITHUB_ENV"
          echo "FLUSH_CONFIRM=$IN_CONFIRM" >> "$GITHUB_ENV"
          echo "FLUSH_DRY_RUN=$IN_DRY_RUN" >> "$GITHUB_ENV"

      - name: Validate confirm
        run: |
          if [ "$FLUSH_CONFIRM" != "yes" ]; then
            echo "ERROR: confirm must be 'yes'"
            exit 1
          fi
          echo "Confirm: OK"

      - name: Dry run (show plan)
        if: success()
        timeout-minutes: 15
        run: |
          echo "=== Redis Flush - Dry Run ==="
          echo "Mode: $FLUSH_MODE"
          python -u redis_flush.py --dry-run --mode "$FLUSH_MODE" --yes

      - name: Stop if dry-run-only
        if: success() && env.FLUSH_DRY_RUN == 'true'
        run: |
          echo "=== Dry-run-only mode - skipping execution ==="
          exit 0

      # [10.0.0] Отдельный шаг Verify после flush удалён: проверка выполняется
      # внутри execute через --post-verify (тот же процесс, минус один полный SCAN)
      # [10.1.0] Лимит 20 -> 15: с пайплайн-батчингом execute идёт секунды;
      # лимит теперь не «время на работу», а детектор зависания — при срабатывании
      # телеграм-алерт шага скажет о нём сразу, без получаса слепого ожидания
      - name: Execute flush
        if: success() && env.FLUSH_DRY_RUN != 'true'
        timeout-minutes: 15
        run: |
          echo "=== Redis Flush - Execute ==="
          echo "Mode: $FLUSH_MODE"
          python -u redis_flush.py --mode "$FLUSH_MODE" --yes --post-verify

      - name: Summary
        if: always()
        run: |
          echo "=== Redis Flush Summary ==="
          echo "Mode: $FLUSH_MODE"
          echo "Confirm: $FLUSH_CONFIRM"
          echo "Dry run only: $FLUSH_DRY_RUN"
          echo ""
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          FLUSH_MODE: ${{ env.FLUSH_MODE }}
        run: |
          MSG="❌ <b>Redis Flush FAILED</b>%0AMode: ${FLUSH_MODE}%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="${MSG}" \
            -d parse_mode="HTML"
            
