name: Source Diagnostics
# [MERGE 10.0.0] Единый диагностический воркфлоу: поглощает check_redis.yml,
# redis_diagnostics.yml, diagnostic_matches.yml (match_dump), redis_flush read-режимы.
# Режимы ядра: full|redis|sources|matches|indexes|errors|sample|propline|keys|history-contracts|memory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим диагностики ядра'
        required: false
        type: choice
        options:
          - full
          - redis
          - sources
          - matches
          - indexes
          - errors
          - sample
          - propline
          - keys
          - history-contracts
          - memory
        default: full
      min_free_mb:
        description: 'Минимум свободной памяти для memory-режима (§13.4)'
        required: false
        type: string
        default: ''

permissions:
  contents: read # Least privilege по правилу §1.10

# [MERGE 10.0.0] Каноническая группа §16.4 — одна очередь для всей read-only диагностики
# (ранее: gatekeeper-diagnostics / redis-diagnostics / source-diagnostics / match_dump)
concurrency:
  group: gatekeeper-diagnostics
  cancel-in-progress: false

env:
  # [MERGE 10.0.0] 3.11: канон §1.10 (аннотации "3.12: синхрон с 9.6.8" не подтверждались
  # содержанием цикла — матрица с 3.12 им как раз удалялась; honest green получен на 3.11)
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  GATEKEEPER_CONFIG_FILE: 'gatekeeper_config.yaml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    # [MERGE 10.0.0] 5 минут по §1.10: ядро на stdlib, pip install убран
    # (аргумент "numpy/scipy съедает 5 минут" относился к старым YML с requirements)
    timeout-minutes: 5

    env:
      # Сетевой транспорт кэш-слоя Redis — полная лестница приоритетов §1.10
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      SHARED_REDIS_REST_URL: ${{ secrets.SHARED_REDIS_REST_URL || '' }}
      SHARED_REDIS_REST_TOKEN: ${{ secrets.SHARED_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      GATEKEEPER_ENV: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # [MERGE 10.0.0] cache: pip убран — pip-установок в воркфлоу нет

      - name: Validate mode
        env:
          # [9.6.8 FIX, перенесено] type: choice НЕ валидируется сервером при запуске
          # через API — произвольная строка доходит до скрипта как есть; чтение из env
          DIAG_MODE: ${{ github.event.inputs.mode || 'full' }}
          DIAG_MIN_FREE_MB: ${{ github.event.inputs.min_free_mb || '' }}
        run: |
          case "$DIAG_MODE" in
            full|redis|sources|matches|indexes|errors|sample|propline|keys|history-contracts|memory)
              ;;
            *)
              echo "⚠ Неизвестный режим '$DIAG_MODE' — откат на full"
              DIAG_MODE=full
              ;;
          esac
          echo "FLUSH_MODE_NOT_USED=true" > /dev/null  # no-op: явный маркер read-only прогона
          echo "DIAG_MODE=$DIAG_MODE" >> "$GITHUB_ENV"
          echo "DIAG_MIN_FREE_MB=$DIAG_MIN_FREE_MB" >> "$GITHUB_ENV"
          echo "Mode: $DIAG_MODE"

      - name: Run diagnostics (stdlib only, no pip install)
        run: |
          # [MERGE 10.0.0] Строгий импорт 13-G1: отсутствие хабов — осознанный exit 1
          if [ -n "$DIAG_MIN_FREE_MB" ] && [ "$DIAG_MODE" = "memory" ]; then
            python -u source_diagnostics.py --mode memory --min-free-mb "$DIAG_MIN_FREE_MB"
          elif [ "$DIAG_MODE" = "full" ]; then
            python -u source_diagnostics.py
          else
            python -u source_diagnostics.py --mode "$DIAG_MODE"
          fi

      - name: Summary
        if: always()
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          echo "=== Source Diagnostics Summary (merged v10.0.0) ==="
          echo "Mode: $MODE"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          DIAG_MODE: ${{ env.DIAG_MODE }}
        run: |
          # [9.6.8 FIX, перенесено] Убран || true: отказ доставки алерта виден в логе.
          # curl — системная утилита раннера, §1.3 регулирует Python-код пакета.
          MSG="❌ <b>Source Diagnostics FAILED</b>%0AMode: ${DIAG_MODE}%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="${MSG}" \
            -d parse_mode="HTML"
