name: Source Diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим диагностики"
        required: false
        type: choice
        options:
          - full
          - sources
          - redis
          - matches
          - errors
        default: full

permissions:
  contents: read

concurrency:
  group: gatekeeper-redis
  cancel-in-progress: false

jobs:
  run-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      PYTHON_VERSION: "3.11"
      PYTHONUNBUFFERED: "1"
      GK_CONFIG_FILE: gatekeeper_config.yaml
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Diagnostics
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "full" ] || [ -z "$MODE" ]; then
            python source_diagnostics.py
          else
            python source_diagnostics.py --${MODE}
          fi

      - name: Summary
        if: always()
        run: |
          echo "=== Source Diagnostics Summary ==="
          MODE="${{ github.event.inputs.mode || 'scheduled' }}"
          echo "Mode: $MODE"
          echo ""
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          if [ "${{ job.status }}" = "success" ]; then
            echo "Status: SUCCESS"
          else
            echo "Status: ${{ job.status }}"
          fi

      - name: Send Telegram Alert on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="❌ Source Diagnostics FAILED at $(date '+%Y-%m-%d %H:%M:%S UTC')" \
            -d parse_mode="HTML" || true
