name: Source Diagnostics

on:
  schedule:
    # Каждые 6 часов
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим диагностики"
        required: false
        type: choice
        options:
          - full
          - sources
          - redis
          - matches
          - errors
        default: full

permissions:
  contents: read

concurrency:
  group: source-diagnostics
  cancel-in-progress: false

jobs:
  run-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHON_VERSION: "3.12"
      PYTHONUNBUFFERED: "1"
      GK_CONFIG_FILE: gatekeeper_config.yaml
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
      SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Diagnostics
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "full" ] || [ -z "$MODE" ]; then
            python source_diagnostics.py
          else
            python source_diagnostics.py --${MODE}
          fi

      - name: Summary
        if: always()
        run: |
          echo "=== Source Diagnostics Summary ==="
          echo "Mode: ${{ github.event.inputs.mode || 'full' }}"
          echo ""
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram alert on failure
        if: failure()
        run: |
          MSG="❌ Source Diagnostics FAILED%0AMode: ${{ github.event.inputs.mode || 'full' }}%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             -d chat_id="${TELEGRAM_CHAT_ID}"             -d text="${MSG}" || true
          
