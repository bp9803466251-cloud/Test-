name: Source Diagnostics

# [10.0.0-merged] Единый диагностический воркфлоу. Заменяет шесть:
#   check_redis.yml, redis_diagnostics.yml (старый), match_dump.yml,
#   а также исторические ветки verify_history и скан-модуля ключей загрузчиков.
# Модуль: source_diagnostics.py (read-only ядро, 12 режимов).
# [10.0.2] Добавлен режим history-sample: разбор живой истории v8.13
#   (SCAN, MGET-гистограмма дат, образцы xG/O/U/AH, консистентность мета).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: full, redis, sources, matches, indexes, errors, sample, propline, keys, history-contracts, history-sample, memory'
        required: false
        type: choice
        options:
          - full
          - redis
          - sources
          - matches
          - indexes
          - errors
          - sample
          - propline
          - keys
          - history-contracts
          - history-sample
          - memory
        default: full
      min_free_mb:
        description: 'Порог свободной памяти для режима memory (МБ, §13.4)'
        required: false
        # [FIX] Порог 512 (и канонический 100) физически недостижим для инстанса 64 МБ —
        # загрузчик был бы заблокирован навсегда. 32 — рабочий порог текущего плана Upstash.
        default: '32'

permissions:
  contents: read

# §16.4: каноническая группа диагностики — все read-only прогоны в одной очереди
concurrency:
  group: gatekeeper-diagnostics
  cancel-in-progress: false

env:
  # [10.0.0] §1.10: единый интерпретатор по репозиторию — 3.11.
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  GATEKEEPER_CONFIG_FILE: 'gatekeeper_config.yaml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Сетевой транспорт кэш-слоя Redis — полная лестница приоритетов §1.10
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      SHARED_REDIS_REST_URL: ${{ secrets.SHARED_REDIS_REST_URL || '' }}
      SHARED_REDIS_REST_TOKEN: ${{ secrets.SHARED_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      GATEKEEPER_ENV: production
      # [FIX] Таймаут транспорта 15 с вместо дефолтных 6: пагинированный HSCAN
      # (~40 страниц по 250 полей на легаси-хэше 43 МБ) на медленном Upstash
      # иначе ловит интермиттентные read-timeout (#76/#77).
      GATEKEEPER_REDIS_TIMEOUT: '15'
      # [10.0.1 FIX] Мапа ключей коллекторов в окружение: без неё диагностика
      # показывает «ключ ❌» даже при прописанных в Secrets значениях (#78).
      # football_data НАМЕРЕННО отсутствует: источник football-data.co.uk —
      # открытые CSV, ключа нет по природе сервиса (не путать с football-data.org).
      SHARP_API_KEY: ${{ secrets.SHARP_API_KEY || '' }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || '' }}
      BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY || '' }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY || '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Diagnostics
        env:
          # [FIXED 9.6.8, сохранён] Инъекция закрыта: ручной ввод интерполируется
          # только в env-блок; type: choice не валидируется при запуске через API
          DIAG_MODE: ${{ github.event.inputs.mode || 'full' }}
          # [FIX] Fallback 512 -> 32: при запуске через API input min_free_mb может
          # не прийти, и fallback вернул бы недостижимый порог
          DIAG_MIN_FREE_MB: ${{ github.event.inputs.min_free_mb || '32' }}
        run: |
          case "$DIAG_MODE" in
            full|redis|sources|matches|indexes|errors|sample|propline|keys|history-contracts|history-sample|memory)
              ;;
            *)
              echo "⚠ Неизвестный режим '$DIAG_MODE' - откат на full"
              DIAG_MODE=full
              ;;
          esac
          echo "Mode: $DIAG_MODE"
          if [ "$DIAG_MODE" = "memory" ]; then
            python -u source_diagnostics.py --mode "$DIAG_MODE" --min-free-mb "$DIAG_MIN_FREE_MB"
          else
            python -u source_diagnostics.py --mode "$DIAG_MODE"
          fi

      # [10.0.6-keyscan FIX] Registry field audit: full-режим не разбирает поля
      # registry:* в легаси-хэше (классифицирует только match:*), а диагноз
      # заселения P0 требует точечных HGET. Шаг с if: always() — аудит обязан
      # отработать и на красной диагностике (контрактный аудит истории даёт
      # exit 1 на пустом контуре — это не сбой). Read-only, записи не делает.
      - name: Registry Field Audit
        if: always()
        run: |
          python -c "
          import json
          import redis_hub as rh

          H = 'GatekeeperAI'
          fields = rh.get_all_fields(H)
          if not isinstance(fields, dict):
              fields = {f: rh.get_from_cache(f) for f in (fields or [])}

          reg = [f for f in fields if f.startswith('registry:')]
          league = [f for f in reg if f.startswith('registry:league:')]
          print('=== REGISTRY FIELD AUDIT ===')
          print('total fields in hash:', len(fields))
          print('registry:* fields  :', len(reg))
          print('registry:league:*  :', len(league))
          if reg:
              print('first 10 registry fields:', sorted(reg)[:10])

          for probe in ('registry:map:country_code', 'registry:system:health', 'telemetry'):
              raw = fields.get(probe)
              if not raw:
                  print(probe, '-> NOT FOUND in hash')
                  continue
              try:
                  d = json.loads(raw)
                  if isinstance(d, dict):
                      print(probe, '-> JSON dict,', len(d), 'keys')
                      for k in ('TUR', 'KOR', 'CHI', 'CHN', 'CAM', 'MON', 'SOU', 'MD', 'ZA'):
                          if k in d:
                              print('   ', k, '->', d[k])
                  else:
                      print(probe, '-> JSON', type(d).__name__)
              except Exception:
                  print(probe, '-> raw,', len(raw), 'bytes:', str(raw)[:120])

          # верхний уровень: обособленные registry-ключи (ожидание после фикса хаба)
          try:
              keys = rh.scan_keys('registry:*')
              print('top-level registry:* keys:', sorted(keys)[:20], '| total:', len(keys))
          except Exception as e:
              print('scan_keys registry:* failed:', e)
          print('=== AUDIT DONE ===')
          "

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          DIAG_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          MSG="❌ <b>Source Diagnostics FAILED</b>%0AMode: ${DIAG_MODE}%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="${MSG}" \
            -d parse_mode="HTML"
            
