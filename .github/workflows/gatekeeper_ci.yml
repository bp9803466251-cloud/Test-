name: Gatekeeper-AI CI Infrastructure Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # [ADDED] Позволяет принудительно пнуть пайплайн кнопкой из веб-интерфейса

jobs:
  compliance_and_docker_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # [ADDED] Защита от зависших шагов: без лимита раннер держится до 6 часов

    steps:
    # Шаг 1: Получение актуального исходного кода из репозитория
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Шаг 2: Инициализация окружения Python 3.12 [CHANGED: 3.11 -> 3.12]
    # Выровнено с патч-циклом 9.6.8 и пином образа Dockerfile (python:3.12-slim)
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # Шаг 3: Установка зависимостей на хост-систему для предварительной проверки
    - name: Install Ecosystem Requirements
      run: |
        python -m pip install --upgrade pip
        # Принудительно ставим минимальный стек для тестов (YAML + Математическое ядро)
        pip install pyyaml numpy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Шаг 4: Жесткая ИБ-проверка регламента §1.3 через глубокий AST-анализ ВСЕХ .py в корне
    # [CHANGED] Раньше список был hardcoded на 4 файла: main.py, value_engine.py,
    # telegram_transport.py и коллекторы оставались вне проверки. Теперь глоб *.py:
    # новые модули попадают под аудит автоматически. Проверка первой компоненты имени
    # отсекает import requests.exceptions, который раньше проходил незамеченным.
    - name: Verify Compliance Rule §1.3 (Anti-Requests Audit)
      run: |
        echo "Запуск глубокого аудита импортов на предмет запрещенных библиотек..."
        python -u -c "
        import ast, glob, os, sys
        py_files = sorted(glob.glob('*.py'))
        if not py_files:
            print('[WARN] Ни одного .py в корне не найдено — аудит пропущен'); sys.exit(1)
        violation = False
        for f in py_files:
            try:
                tree = ast.parse(open(f, 'r', encoding='utf-8').read(), filename=f)
            except SyntaxError as e:
                print(f'[FAIL] Синтаксическая ошибка в {f}: {e}'); violation = True; continue
            for node in ast.walk(tree):
                if isinstance(node, ast.Import):
                    for a in node.names:
                        if a.name.split('.')[0] == 'requests':
                            print(f'[CRITICAL SECURITY BREACH] requests found in {f}'); violation = True
                if isinstance(node, ast.ImportFrom) and node.module is not None:
                    if node.module.split('.')[0] == 'requests':
                        print(f'[CRITICAL SECURITY BREACH] requests from-import found in {f}'); violation = True
        if violation: sys.exit(1)
        print(f'[COMPLIANCE] Проверено файлов: {len(py_files)}. Библиотека requests отсутствует в кодовой базе. Регламент соблюден.')
        "

    # Шаг 5: Локальный небуферизированный прогон всех 28 гейтов на хосте воркфлоу (Включая структурную защиту v710)
    - name: Run Contract Gateways (28/28 Testing)
      run: |
        python -u test_contracts.py

    # Шаг 6: Валидация контейнеризации [CHANGED: up -> config + build]
    # Причина: прод-CMD образа теперь вечный main.py (конвейер), поэтому
    # up --abort-on-container-exit повис бы до timeout-minutes. Валидируем
    # манифест и собираем образ, не запуская контейнер.
    # [REMOVED] Сервис redis_mock: TCP-Redis на 6379 несовместим с Upstash REST
    # API, на котором работает весь пакет (§6) — ни один тест с ним не общался,
    # это был мёртвый груз минут раннера на каждом push.
    - name: Validate Containerization via docker compose
      if: ${{ hashFiles('docker_compose.yml') != '' }}
      run: |
        echo "Валидация манифеста и сборка образа (без запуска: прод-CMD — вечный main.py)..."
        docker compose -f docker_compose.yml config --quiet
        docker compose -f docker_compose.yml build gatekeeper_core

    # Шаг 7: Финальное уведомление (Опционально, если тесты упали)
    - name: Pipeline Failure Notification
      if: failure()
      run: |
        echo "🔴 CI Tests FAILED в контуре сборки. Проверьте логи выполнения контрактов."
