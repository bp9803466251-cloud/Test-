# ═══════════════════════════════════════════════════════════════════════
# Odds Priority — ранги источников коэффициентов (§19.2)
# Меньший ранг = высший приоритет. Источник с рангом 1 перебивает ранг 6.
# Загружается из odds_priority.yaml, включается через !include в config.
# Заменяет хардкод UPSTREAM_MAP из §1.20.
# ═══════════════════════════════════════════════════════════════════════

# ── Основные 1x2 ──────────────────────────────────────────────────────
1x2:
  sharpapi:    1    # sharp-букмекер, высший приоритет
  odds_api:    3    # агрегатор
  propline:    6    # pinnacle
  bzzoiro:     8    # soft
  football_data: 10 # historical

# ── Тоталы (over/under) ───────────────────────────────────────────────
ou25:
  sharpapi:    1
  odds_api:    3
  propline:    6

# ── Фора (азиатский гандикап) ─────────────────────────────────────────
ah:
  sharpapi:    1
  odds_api:    3
  propline:    6

# ── Закрытие линии ────────────────────────────────────────────────────
closing_1x2:
  propline:    1    # closing odds — только Pinnacle
  sharpapi:    2

# ── Upstream-маппинг (fallback) ───────────────────────────────────────
upstream_map:
  sharpapi: "betradar"
  odds_api: "betradar"
  bzzoiro: "opta"
  propline: "pinnacle"
  football_data: "bet365"
