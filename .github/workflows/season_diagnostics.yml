name: Season Diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска"
        required: false
        default: "seasons"
        type: choice
        options:
          - seasons
          - full

env:
  PYTHON_VERSION: "3.12"
  GK_CONFIG_FILE: "./gatekeeper_config.yaml"

permissions:
  contents: read

concurrency:
  group: gatekeeper-redis
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install --upgrade pyyaml requests

    - name: Run Season Check
      if: github.event.inputs.mode == 'seasons' || github.event.inputs.mode == ''
      env:
        SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
        SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}
      run: python seasons_check.py

    - name: Run Full Diagnostics
      if: github.event.inputs.mode == 'full'
      env:
        SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
        SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
        BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
        SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}
      run: python source_diagnostics.py
      
