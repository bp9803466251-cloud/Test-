name: Season Diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска"
        required: false
        default: "seasons"
        type: choice
        options:
          - seasons
          - full

env:
  PYTHON_VERSION: "3.12"
  GK_CONFIG_FILE: "gatekeeper_config.yaml"

permissions:
  contents: read

concurrency:
  group: season-diagnostics
  cancel-in-progress: false  # TODO: изменить на true после внедрения idempotency_key

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Season Check
      if: github.event.inputs.mode == 'seasons' || github.event.inputs.mode == ''
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}
      run: python seasons_check.py

    - name: Run Full Diagnostics
      if: github.event.inputs.mode == 'full'
      env:
        BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
        SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}
      run: python source_diagnostics.py

    - name: Summary
      if: always()
      run: |
        echo "=== Season Diagnostics Summary ==="
        echo "Mode: ${{ github.event.inputs.mode }}"
        echo ""
        echo "Run ID: ${{ github.run_id }}"
        echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo ""
        if [ "${{ job.status }}" = "success" ]; then
          echo "Status: SUCCESS"
        else
          echo "Status: ${{ job.status }}"
        fi
        
