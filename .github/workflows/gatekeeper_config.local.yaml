# ═══════════════════════════════════════════════════════════════════════
# GatekeeperAI — Единая конфигурация (§20.3)
# Версия: 8.9 | Schema: v710
# Загружается gatekeeper_config.py при старте каждого модуля
# ═══════════════════════════════════════════════════════════════════════

schema_version: "v710"
pipeline_batch_size: 10

# ── Приоритеты букмекеров (§19.2) ────────────────────────────────────
odds_priority:
  sharpapi:    1
  odds_api:    3
  propline:    6
  bzzoiro:     8
  football_data: 10

# ── Feature Flags (§22.3) ────────────────────────────────────────────
features:
  schema_validation:
    enabled: true
    level: "strict"            # "strict" | "warn" | "off"
  audit_log:
    enabled: true
  provenance:
    enabled: true              # §21.1
  auto_migrate:
    enabled: false             # §20.5 — авто-миграция live → history
  conflict_resolution:
    enabled: true              # §23.1
  idempotency_keys:
    enabled: true              # §23.2
  graceful_shutdown:
    enabled: true              # §23.3
  state_machine:
    enabled: true              # §24.1
  metrics:
    enabled: true              # §24.5

# ── Namespace Isolation (§23.7) ──────────────────────────────────────
namespace:
  prefix: ""                   # пустой = без префикса (текущее поведение)
  domains:
    football: ""
    basketball: "basket"

# ── Canary Deployment (§23.8) ────────────────────────────────────────
canary:
  enabled: false
  ttl_hours: 24
  cleanup_on_success: true

# ── Data Lineage (§23.5) ─────────────────────────────────────────────
data_lineage:
  sharpapi:
    provides: ["odds.1x2.current", "odds.1x2.opening", "odds.1x2.best"]
    consumed_by: ["telegram_bot", "analytics_pipeline", "value_analysis"]
  odds_api:
    provides: ["odds.1x2.current", "odds.1x2.sources"]
    consumed_by: ["telegram_bot", "odds_aggregator"]
  bzzoiro:
    provides: ["stats", "predictions", "h2h"]
    consumed_by: ["telegram_bot", "analytics_pipeline", "xg_calculator"]
  propline:
    provides: ["odds.1x2.opening", "odds.closing_1x2"]
    consumed_by: ["value_analysis", "telegram_bot"]
  football_data:
    provides: ["csv_raw", "history.match"]
    consumed_by: ["analytics_pipeline", "model_training"]

# ── Shared Code Distribution (§24.2) ─────────────────────────────────
shared_code:
  distribution: "vendored"
  source_repo: "gatekeeper-shared"
  pinned_version: "v8.9"
  auto_update: false
  files:
    - gatekeeper_hub.py
    - redis_hub.py
    - search_module.py
    - gatekeeper_config.yaml

# ── Collector Orchestration (§24.7) ──────────────────────────────────
orchestration:
  sequence:
    - name: sharpapi
      depends_on: []
    - name: odds_api
      depends_on: []
    - name: bzzoiro
      depends_on: ["sharpapi"]
    - name: propline
      depends_on: ["sharpapi", "odds_api"]
  parallel_groups:
    - [sharpapi, odds_api]
  cleanup_owner: "sharpapi"     # только sharpapi вызывает cleanup_expired

# ── Multi-Environment (§24.4) ────────────────────────────────────────
environments:
  prod:
    redis_url_env: "SHARED_UPSTASH_REDIS_REST_URL"
    redis_token_env: "SHARED_UPSTASH_REDIS_REST_TOKEN"
    namespace_prefix: ""
    features:
      schema_validation: {enabled: true, level: "strict"}
      audit_log: {enabled: true}
  staging:
    redis_url_env: "STAGING_REDIS_URL"
    redis_token_env: "STAGING_REDIS_TOKEN"
    namespace_prefix: "staging"
    features:
      schema_validation: {enabled: true, level: "warn"}
      audit_log: {enabled: false}
  dev:
    redis_url_env: "DEV_REDIS_URL"
    redis_token_env: "DEV_REDIS_TOKEN"
    namespace_prefix: "dev"
    features:
      schema_validation: {enabled: false}
      audit_log: {enabled: false}
