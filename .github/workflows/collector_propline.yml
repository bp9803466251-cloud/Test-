name: Collector Propline

on:
  schedule:
    # Каждые 2 часа (согласно плану аудита)
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Запустить в режиме dry-run (не писать в Redis)'
        required: false
        default: 'false'

concurrency:
  group: gatekeeper-redis
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests redis urllib3

      - name: Run Collector
        env:
          PROPLINE_API_KEY: \${{ secrets.PROPLINE_API_KEY }}
          SHARED_UPSTASH_REDIS_REST_URL: \${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: \${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
          PROPLINE_RATE_DELAY: \${{ github.event.inputs.dry_run == 'true' && '0.0' || '0.2' }}
        run: |
          if [ "\${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Running in DRY-RUN mode..."
            python collector_propline.py --dry-run
          else
            echo "Running in PRODUCTION mode..."
            python collector_propline.py
          fi

      - name: Send Success Notification
        if: success()
        run: |
          curl -X POST "https://api.telegram.org/bot\${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="\${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Propline Collector completed successfully at \$(date)"

      - name: Send Failure Notification
        if: failure()
        run: |
          curl -X POST "https://api.telegram.org/bot\${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="\${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Propline Collector FAILED at \$(date)\nCheck logs for details."
            
