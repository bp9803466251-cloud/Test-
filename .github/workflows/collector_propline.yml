name: Collector Propline

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Дней вперёд для фильтрации матчей'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: collector-propline
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12' # [FIXED] 3.11 -> 3.12: синхрон с патч-циклом 9.6.8
  PYTHONUNBUFFERED: '1'
  GK_CONFIG_FILE: gatekeeper_config.yaml

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # [FIXED] Инъекция закрыта: интерполяция ручного ввода только в env-блоке
      # (там GitHub подставляет значение как строку), в run-скрипте — чтение из env
      - name: Run Propline collector
        run: python -u collector_propline.py
        env:
          # Сетевой транспорт кэш-слоя Redis — полная лестница приоритетов §1.10
          # [FIXED] Добавлено среднее звено SHARED_REDIS_REST_*, отсутствовавшее в исходнике
          SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
          SHARED_REDIS_REST_URL: ${{ secrets.SHARED_REDIS_REST_URL || '' }}
          SHARED_REDIS_REST_TOKEN: ${{ secrets.SHARED_REDIS_REST_TOKEN || '' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
          # Ключ поставщика и настройки квот
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY || '' }}
          PROPLINE_MAX_RETRIES: '2'
          PROPLINE_API_TIMEOUT: '10'
          PROPLINE_MAX_WORKERS: '8'
          PROPLINE_QUOTA_MIN: '10'
          # [FIXED] Значение ручного ввода — только через env-блок, не интерполяцией в шелл
          PROPLINE_DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '1' }}
          GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}
          # [ADDED] Паритет с docker_compose.yml и sports_pipeline.yml
          GATEKEEPER_ENV: production

      # [FIXED] Инъекция закрыта: ранее ввод интерполировался прямо в run-скрипт;
      # все интерполяции перенесены в env-блок, скрипт читает переменные окружения
      - name: Summary
        if: always()
        env:
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '1' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "=== Propline Collector Summary ==="
          echo "Days ahead: $DAYS_AHEAD"
          echo "Run URL: $RUN_URL"

      # [FIXED] || true удалён: сбой доставки алерта теперь виден в логе.
      # curl — CLI-утилита раннера, §1.3 регулирует Python-код пакета, не CI-скрипты
      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="Propline Collector FAILED. Run: ${RUN_URL}"
