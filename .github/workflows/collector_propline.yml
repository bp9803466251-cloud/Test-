name: Collector — PropLine (Pinnacle)

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Включить debug-логи'
        required: false
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir requests

      - name: Run collector
        run: python collector_propline.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: propline-failure-logs
          path: |
            *.log
          retention-days: 7
          
