name: Collector Propline

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Дней вперёд'
        required: false
        default: '3'

permissions:
  contents: read

concurrency:
  group: collector-propline
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  GK_CONFIG_FILE: 'gatekeeper_config.yaml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Propline collector
        run: python collector_propline.py
        env:
          SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PROPLINE_RATE_DELAY: '1.0'
          PROPLINE_MAX_RETRIES: '3'
          PROPLINE_DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '3' }}
          GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}

      - name: Summary
        if: always()
        run: |
          echo "=== Propline Collector Summary ==="
          echo "Days ahead: ${{ github.event.inputs.days_ahead || '3' }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          MSG="❌ Propline Collector FAILED%0A%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             -d chat_id="${TELEGRAM_GROUP_ID}"             -d text="${MSG}" || true
