name: Redis Diagnostics

on:
  workflow_dispatch:
    inputs:
      json_output:
        description: 'Вывести отчет в JSON формате'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: redis-diagnostics
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  GATEKEEPER_CONFIG_FILE: 'gatekeeper_config.yaml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      GATEKEEPER_ENV: prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Redis Diagnostics
        run: |
          if [ "${{ github.event.inputs.json_output }}" == "true" ]; then
            python redis_diagnostics.py --json
          else
            python redis_diagnostics.py
          fi

      - name: Telegram alert on failure
        if: failure()
        run: |
          MSG="❌ <b>Redis Diagnostics FAILED</b>%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_GROUP_ID }}" \
            -d text="${MSG}" \
            -d parse_mode="HTML" || true
            
