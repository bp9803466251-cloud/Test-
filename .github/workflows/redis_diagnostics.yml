name: Redis Diagnostics

on:
  workflow_dispatch:
    inputs:
      json_output:
        description: 'Вывести отчет в JSON формате'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: redis-diagnostics # [KEEP] Собственная группа была корректна — сохранена
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12' # [FIXED] 3.11 -> 3.12: синхрон с патч-циклом 9.6.8
  PYTHONUNBUFFERED: '1'
  GATEKEEPER_CONFIG_FILE: 'gatekeeper_config.yaml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Сетевой транспорт кэш-слоя Redis — полная лестница приоритетов §1.10
      # [FIXED] Добавлено среднее звено SHARED_REDIS_REST_*, отсутствовавшее в исходнике
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      SHARED_REDIS_REST_URL: ${{ secrets.SHARED_REDIS_REST_URL || '' }}
      SHARED_REDIS_REST_TOKEN: ${{ secrets.SHARED_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      GATEKEEPER_ENV: production # [FIXED] prod -> production: синхрон с docker_compose.yml

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip # [ADDED] Кэш pip между запусками

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Redis Diagnostics
        env:
          # [FIXED] Инъекция закрыта: ручной ввод интерполируется только в env-блоке,
          # в run-скрипте — чтение из переменной окружения
          DIAG_JSON: ${{ github.event.inputs.json_output || 'false' }}
        run: |
          # [FIXED] -u: небуферизированный вывод в логи Actions
          if [ "$DIAG_JSON" = "true" ]; then
            python -u redis_diagnostics.py --json
          else
            python -u redis_diagnostics.py
          fi

      - name: Telegram alert on failure
        if: failure()
        env:
          # [FIXED] Секреты перенесены из интерполяции в шелле в env-блок
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          # [FIXED] Убран || true: отказ доставки алерта должен быть виден в логе.
          # URL здесь был каноническим (единственный из пяти) — сохранен.
          # curl — системная утилита раннера, §1.3 регулирует Python-код пакета.
          MSG="❌ <b>Redis Diagnostics FAILED</b>%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="${MSG}" \
            -d parse_mode="HTML"
            
