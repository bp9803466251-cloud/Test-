name: Check Redis

on:
  workflow_dispatch:

permissions:
  contents: read # Least privilege по правилу §1.10

# [AUDIT 2026-11-04] group check-redis -> gatekeeper-diagnostics: канонические группы §16.4
# (collector-*, gatekeeper-pipeline, gatekeeper-diagnostics); произвольные имена вне реестра.
concurrency:
  group: gatekeeper-diagnostics
  cancel-in-progress: false

env:
  # [AUDIT 2026-11-04] 3.12 -> 3.11: §1.10 требует единый интерпретатор по репозиторию
  # (матрица 3.10/3.12 удалена именно по этому правилу; backtest.yml стоит на 3.11).
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    # [AUDIT 2026-11-04] 15 -> 5: §1.10 «утилиты и диагностика — 5 минут».
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Run diagnostic script
        env:
          # Сетевой транспорт кэш-слоя Redis - полная лестница приоритетов §1.10
          SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
          SHARED_REDIS_REST_URL: ${{ secrets.SHARED_REDIS_REST_URL || '' }}
          SHARED_REDIS_REST_TOKEN: ${{ secrets.SHARED_REDIS_REST_TOKEN || '' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
        # pip install не требуется: скрипт на чистом stdlib (+ опциональный импорт HASH_NAME
        # из redis_hub с fallback - установка зависимостей не нужна).
        run: python -u check_redis.py
