name: Check Redis

on:
  workflow_dispatch:

permissions:
  contents: read # [ADDED] Least privilege по правилу §1.10 - отсутствовал в исходнике

concurrency:
  group: check-redis # [ADDED] В исходнике группы не было вовсе - повторный запуск мог наложиться на идущий
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12' # [FIXED] 3.11 -> 3.12: синхрон с патч-циклом 9.6.8
  PYTHONUNBUFFERED: '1'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # [ADDED] Защита от зависаний: в исходнике таймаута не было

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Run diagnostic script
        env:
          # Сетевой транспорт кэш-слоя Redis - полная лестница приоритетов §1.10
          # [FIXED] Добавлено среднее звено SHARED_REDIS_REST_*, отсутствовавшее в исходнике
          SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
          SHARED_REDIS_REST_URL: ${{ secrets.SHARED_REDIS_REST_URL || '' }}
          SHARED_REDIS_REST_TOKEN: ${{ secrets.SHARED_REDIS_REST_TOKEN || '' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
        # [FIXED] -u: небуферизированный вывод в логи Actions.
        # pip install не требуется: скрипт на чистом stdlib (+ опциональный импорт HASH_NAME
        # из redis_hub с fallback - установка зависимостей не нужна).
        run: python -u check_redis.py
        
