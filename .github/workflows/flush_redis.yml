name: Flush Redis

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим запуска'
        type: choice
        options:
          - diagnostics
          - history
          - test
          - flush
        default: test
      confirm:
        description: 'Type "yes" to confirm flush (только для mode=flush)'
        required: false
        default: 'no'
      hard:
        description: 'Type "yes" for hard flush (только для mode=flush)'
        required: false
        default: 'no'

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

concurrency:
  group: gatekeeper-redis
  cancel-in-progress: false

jobs:
  flush-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run mode
        run: |
          MODE="${{ inputs.mode || 'diagnostics' }}"
          echo "[WORKFLOW] Mode: $MODE"

          if [ "$MODE" = "test" ]; then
            echo "[WORKFLOW] Running test diagnostics..."
            python redis_diagnostics.py --test

          elif [ "$MODE" = "history" ]; then
            echo "[WORKFLOW] Running history diagnostics..."
            python redis_diagnostics.py --history

          elif [ "$MODE" = "flush" ]; then
            CONFIRM="${{ inputs.confirm }}"
            HARD="${{ inputs.hard }}"
            HARD_LOWER=$(echo "$HARD" | tr '[:upper:]' '[:lower:]')

            if [ "$CONFIRM" != "yes" ]; then
              echo "[WORKFLOW] Flush not confirmed (confirm != yes). Running diagnostics only."
              python redis_diagnostics.py
              exit 0
            fi

            if [ "$HARD_LOWER" = "yes" ]; then
              echo "[WORKFLOW] HARD flush requested"
              python redis_diagnostics.py --flush --hard --yes
            else
              echo "[WORKFLOW] SOFT flush requested"
              python redis_diagnostics.py --flush --yes
            fi

          else
            echo "[WORKFLOW] Running standard diagnostics..."
            python redis_diagnostics.py
          fi

      - name: Diagnostics after flush
        if: ${{ inputs.mode == 'flush' && inputs.confirm == 'yes' }}
        run: python redis_diagnostics.py
        
