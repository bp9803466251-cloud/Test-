name: Flush Redis

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm flush'
        required: true
        default: 'no'
      hard:
        description: 'Type "yes" for hard flush (wipe ALL match:* keys including orphans)'
        required: false
        default: 'no'

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

concurrency:
  group: gatekeeper-redis
  cancel-in-progress: false

jobs:
  flush-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Diagnostics before flush
        run: python redis_diagnostics.py

      - name: Flush Redis
        if: ${{ inputs.confirm == 'yes' }}
        run: |
          HARD="${{ inputs.hard }}"
          if [ "${HARD,,}" = "yes" ]; then
            echo "[WORKFLOW] HARD flush requested"
            python redis_diagnostics.py --flush --hard --yes
          else
            echo "[WORKFLOW] SOFT flush requested"
            python redis_diagnostics.py --flush --yes
          fi

      - name: Diagnostics after flush
        if: ${{ inputs.confirm == 'yes' }}
        run: python redis_diagnostics.py
        
