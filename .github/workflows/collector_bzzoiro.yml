name: Collector Bzzoiro

on:
  workflow_dispatch:
    inputs:
      events_only:
        description: "Только матчи, без enrichment"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run (без записи в Redis)"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  GK_CONFIG_FILE: "gatekeeper_config.yaml"

permissions:
  contents: read

# FIX-AUDIT-v9.3: concurrency.group → gatekeeper-redis (§13)
concurrency:
  group: gatekeeper-redis
  cancel-in-progress: false

jobs:
  collect-bzzoiro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run collector
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
          SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          # FIX-AUDIT-v9.3: defaults aligned with §20.3 (2.0/1.0/5 instead of 0.3/0.2/1)
          BZZOIRO_RATE_DELAY: ${{ vars.BZZOIRO_RATE_DELAY || '2.0' }}
          BZZOIRO_ENRICH_DELAY: ${{ vars.BZZOIRO_ENRICH_DELAY || '1.0' }}
          BZZOIRO_MAX_RETRIES: ${{ vars.BZZOIRO_MAX_RETRIES || '5' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.events_only }}" = "true" ]; then
            ARGS="--events-only"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python collector_bzzoiro.py $ARGS

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # FIX-AUDIT-v9.3: TELEGRAM_CHAT_ID instead of TELEGRAM_GROUP_ID (§13)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🔴 <b>Collector Bzzoiro FAILED</b>%0ARepo: ${{ github.repository }}%0ARun: ${{ github.run_id }}%0A%0A👉 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" || true
            
