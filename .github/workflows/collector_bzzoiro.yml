name: Collector Bzzoiro

on:
  workflow_dispatch:
    inputs:
      events_only:
        description: "Только матчи, без enrichment"
        type: boolean
        default: false

permissions:
  contents: read

# FIX-3: Concurrency — предотвращает двойную запись в Redis
concurrency:
  group: collector-bzzoiro
  cancel-in-progress: false  # TODO: изменить на true после внедрения idempotency_key

jobs:
  collect-bzzoiro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_VERSION: '3.12'
      PYTHONUNBUFFERED: '1'
      GK_CONFIG_FILE: gatekeeper_config.yaml
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
      BZZOIRO_RATE_DELAY: '1.5'
      BZZOIRO_ENRICH_DELAY: '0.5'
      BZZOIRO_MAX_RETRIES: '3'
      BZZOIRO_DAYS_AHEAD: '7'
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.events_only }}" = "true" ]; then
            ARGS="--events-only"
          fi
          python collector_bzzoiro.py $ARGS

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bzzoiro-failure-logs
          path: |
            *.log
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "=== Collector Bzzoiro Summary ==="
          echo "Events only: ${{ inputs.events_only }}"
          echo ""
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          if [ "${{ job.status }}" = "success" ]; then
            echo "Status: SUCCESS"
          else
            echo "Status: ${{ job.status }}"
          fi
          
