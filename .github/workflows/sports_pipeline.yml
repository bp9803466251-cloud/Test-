name: Gatekeeper AI Analytical Pipeline

on:
  workflow_dispatch: # Строго ручной запуск по правилу §1.2

permissions:
  contents: read # Least privilege по правилу §1.10

concurrency:
  group: gatekeeper-pipeline # Изолированная concurrency-группа (§12)
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11' # Единая Python-версия по стандарту §1.33
  GATEKEEPER_CONFIG_FILE: 'gatekeeper_config.yaml' # Синхронизировано со спецификацией gatekeeper_config.py

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Защита от зависаний по правилу §1.10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Mathematics Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Принудительно гарантируем наличие NumPy и SciPy для CORE ENGINE V6.7
          pip install numpy scipy

      - name: Execute CORE ENGINE V6.7
        run: python main.py
        env:
          # Сетевой транспорт кэш-слоя Redis (redis_config.py)
          SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}

          # Ключи поставщиков данных для DATA ENGINE V6.7
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          APIFY_SCRAPER_KEY: ${{ secrets.APIFY_SCRAPER_KEY }}

          # [SYNCHRONIZED] Направлен секрет группы на ожидаемую транспортом переменную TELEGRAM_CHAT_ID
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          
          # Системное окружение конфигурации
          GATEKEEPER_CONFIG_FILE: ${{ env.GATEKEEPER_CONFIG_FILE }}
          GATEKEEPER_ENV: prod
          
