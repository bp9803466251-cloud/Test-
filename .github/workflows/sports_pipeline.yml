name: Sports Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatekeeper-redis
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  GK_CONFIG_FILE: './gatekeeper_config.yaml'

jobs:
  # ── Stage 1: Parallel collectors (no dependencies) ──
  sharpapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python collector_sharpapi.py
        env:
          SHARED_UPSTASH_REDIS_REST_URL: \${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: \${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
          SHARPAPI_API_KEY: \${{ secrets.SHARPAPI_API_KEY }}
          SHARPAPI_RATE_LIMIT_DELAY: '1.0'
          SHARPAPI_MAX_PAGES: '5'
          SHARPAPI_LIMIT: '100'
          SHARPAPI_DAYS_AHEAD: '3'
          GK_CONFIG_FILE: \${{ env.GK_CONFIG_FILE }}

  odds_api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python collector_odds_api.py
        env:
          SHARED_UPSTASH_REDIS_REST_URL: \${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: \${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
          ODDS_API_KEY: \${{ secrets.ODDS_API_KEY }}
          ODDS_API_RATE_DELAY: '1.0'
          ODDS_API_MAX_RETRIES: '3'
          ODDS_API_REGIONS: 'eu'
          ODDS_API_MARKETS: 'h2h'
          ODDS_API_ODDS_FORMAT: 'decimal'
          ODDS_API_DAYS_AHEAD: '3'
          GK_CONFIG_FILE: \${{ env.GK_CONFIG_FILE }}

  # ── Stage 2: Bzzoiro (needs: sharpapi) ──
  bzzoiro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sharpapi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python collector_bzzoiro.py
        env:
          SHARED_UPSTASH_REDIS_REST_URL: \${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: \${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
          BZZOIRO_API_KEY: \${{ secrets.BZZOIRO_API_KEY }}
          BZZOIRO_RATE_DELAY: '1.5'
          BZZOIRO_ENRICH_DELAY: '0.5'
          BZZOIRO_MAX_RETRIES: '3'
          BZZOIRO_DAYS_AHEAD: '7'
          GK_CONFIG_FILE: \${{ env.GK_CONFIG_FILE }}

  # ── Stage 3: Propline (needs: sharpapi, odds_api) ──
  propline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [sharpapi, odds_api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python collector_propline.py
        env:
          SHARED_UPSTASH_REDIS_REST_URL: \${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: \${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
          PROPLINE_API_KEY: \${{ secrets.PROPLINE_API_KEY }}
          PROPLINE_RATE_DELAY: '1.0'
          PROPLINE_MAX_RETRIES: '3'
          PROPLINE_DAYS_AHEAD: '3'
          GK_CONFIG_FILE: \${{ env.GK_CONFIG_FILE }}

  # ── Stage 4: Contract tests + Pipeline ──
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sharpapi, odds_api, bzzoiro, propline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python test_contracts.py
        env:
          SHARED_UPSTASH_REDIS_REST_URL: \${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: \${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
          GK_CONFIG_FILE: \${{ env.GK_CONFIG_FILE }}

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [contract-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python main.py
        env:
          SHARED_UPSTASH_REDIS_REST_URL: \${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: \${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: \${{ secrets.TELEGRAM_GROUP_ID }}
          SHARED_TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          SHARED_TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_GROUP_ID || '' }}
          GK_CONFIG_FILE: \${{ env.GK_CONFIG_FILE }}
          VALUE_BET_THRESHOLD: '0.03'
          
