name: Download CSV Data

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Сезоны через запятую (пусто = все 11, пример: 2425,2526)'
        required: false
        default: ''
      leagues:
        description: 'Лиги через запятую (пусто = все 22, пример: E0,SP1,I1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download CSV files
        run: |
          SEASONS="${{ inputs.seasons }}"
          LEAGUES="${{ inputs.leagues }}"
          ARGS=""
          if [ -n "$SEASONS" ]; then ARGS="$ARGS --seasons $SEASONS"; fi
          if [ -n "$LEAGUES" ]; then ARGS="$ARGS --leagues $LEAGUES"; fi
          python football_data_downloader.py $ARGS

      - name: Show stats
        run: |
          echo "=== Downloaded files ==="
          find csv_data -name "*.csv" | wc -l
          echo "=== By season ==="
          for dir in csv_data/*/; do
            count=$(find "$dir" -name "*.csv" | wc -l)
            echo "  $(basename $dir): $count files"
          done
          echo "=== Total size ==="
          du -sh csv_data/

      - name: Commit CSV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add csv_data/
          if git diff --staged --quiet; then
            echo "No new CSV files to commit"
          else
            git commit -m "chore: download CSV data from football-data.co.uk"
            git push
          fi
