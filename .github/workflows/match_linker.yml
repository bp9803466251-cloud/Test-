name: Match Linker & Analyzer

# §1.2: workflow_dispatch only — cron '0 */6 * * *' удалён
on:
  workflow_dispatch:

permissions:
  contents: read

# §16.4: каноническая группа pipeline-слоя (линковка + анализ + дашборд)
concurrency:
  group: gatekeeper-pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'

jobs:
  run-linker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
      GATEKEEPER_ENV: production
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Match Linker
        run: python match_linker.py
        
