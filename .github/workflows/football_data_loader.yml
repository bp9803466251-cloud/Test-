name: Football Data Loader

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Сезоны через запятую (пусто = авто по текущей дате)'
        required: false
        default: ''
      leagues:
        description: 'Лиги через запятую (пусто = все 22)'
        required: false
        default: ''
      history_days:
        description: 'Окно истории в днях (0 = весь CSV)'
        required: false
        default: '0'
      limit:
        description: 'Лимит матчей на лигу (0 = все)'
        required: false
        default: '0'
      dry_run:
        description: 'Dry-run (без записи в Redis)'
        type: boolean
        required: false
        default: false
      flush:
        description: 'Очистить старые ключи перед загрузкой'
        type: boolean
        required: false
        default: false

# FIX-3: Concurrency — предотвращает двойную запись в Redis
concurrency:
  group: football-data-loader
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SEASONS_INPUT: ${{ github.event.inputs.seasons }}
      LEAGUES_INPUT: ${{ github.event.inputs.leagues }}
      HISTORY_DAYS_INPUT: ${{ github.event.inputs.history_days }}
      LIMIT_INPUT: ${{ github.event.inputs.limit }}
      DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
      FLUSH_INPUT: ${{ github.event.inputs.flush }}
      # FIX-1: SHARED_* — для redis_hub (транспортный слой)
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
      # FIX-1: UPSTASH_* — для verify-шага (прямой доступ)
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # FIX-5: Путь к gatekeeper_config.yaml
      GK_CONFIG_FILE: gatekeeper_config.yaml
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # FIX-2: 3.12 — единая версия для всех workflow
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Flush old keys (optional)
        if: ${{ github.event.inputs.flush == 'true' }}
        run: |
          echo "Flushing football_data:* keys..."
          python -c "
          import os, json, urllib.request
          URL = os.environ.get('SHARED_UPSTASH_REDIS_REST_URL', '').rstrip('/')
          TOKEN = os.environ.get('SHARED_UPSTASH_REDIS_REST_TOKEN', '')
          if not URL or not TOKEN:
              print('WARN: No SHARED_* Redis creds, trying UPSTASH_*')
              URL = os.environ.get('UPSTASH_REDIS_REST_URL', '').rstrip('/')
              TOKEN = os.environ.get('UPSTASH_REDIS_REST_TOKEN', '')
          if not URL or not TOKEN:
              print('ERROR: No Redis creds')
              exit(1)
          def cmd(*args):
              req = urllib.request.Request(
                  URL,
                  data=json.dumps(list(args)).encode(),
                  headers={'Authorization': f'Bearer {TOKEN}',
                           'Content-Type': 'application/json'}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read()).get('result')
          # SCAN + DEL football_data:* keys
          cursor = '0'
          deleted = 0
          while True:
              result = cmd('SCAN', cursor, 'MATCH', 'football_data:*', 'COUNT', 100)
              cursor = result[0]
              keys = result[1]
              if keys:
                  cmd('DEL', *keys)
                  deleted += len(keys)
              if cursor == '0':
                  break
          print(f'Flushed {deleted} football_data:* keys')
          "

      - name: Run Football Data Collector
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          DRY_FLAG=""
          if [ "${DRY_RUN_INPUT}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python -u football_data_to_redis.py \
            --seasons "${SEASONS_INPUT}" \
            --leagues "${LEAGUES_INPUT}" \
            --history-days ${HISTORY_DAYS_INPUT} \
            --limit ${LIMIT_INPUT} \
            ${DRY_FLAG}

      - name: Verify Redis data
        if: success()
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 10
        run: |
          python -c "
          import os, json, urllib.request, sys
          from datetime import datetime, timezone

          # FIX-1: Prefer SHARED_* (redis_hub), fallback UPSTASH_*
          URL = os.environ.get('SHARED_UPSTASH_REDIS_REST_URL', '') or os.environ.get('UPSTASH_REDIS_REST_URL', '')
          URL = URL.rstrip('/')
          TOKEN = os.environ.get('SHARED_UPSTASH_REDIS_REST_TOKEN', '') or os.environ.get('UPSTASH_REDIS_REST_TOKEN', '')
          LIMIT = os.environ.get('LIMIT_INPUT', '0')

          if not URL or not TOKEN:
              print('ERROR: Redis credentials not configured')
              sys.exit(1)

          def cmd(*args):
              try:
                  req = urllib.request.Request(
                      URL,
                      data=json.dumps(list(args)).encode(),
                      headers={'Authorization': f'Bearer {TOKEN}',
                               'Content-Type': 'application/json'}
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read()).get('result')
              except Exception as e:
                  print(f'  [CMD ERROR] {args[0]}: {e}')
                  return None

          print('=== Redis Verify ===')
          dbsize = cmd('DBSIZE')
          print(f'DBSIZE: {dbsize}')
          if dbsize is None:
              print('FATAL: Redis unavailable')
              sys.exit(1)

          leagues_raw = os.environ.get('LEAGUES_INPUT', '')
          leagues = leagues_raw.split(',') if leagues_raw else []
          if not leagues:
              leagues = ['E0','E1','E2','E3','EC','SC0','SC1','SC2','SC3',
                         'D1','D2','I1','I2','SP1','SP2','F1','F2',
                         'N1','B1','P1','T1','G1']

          seasons_raw = os.environ.get('SEASONS_INPUT', '')
          seasons = seasons_raw.split(',') if seasons_raw else []
          if not seasons:
              now = datetime.now(timezone.utc)
              seasons = [f'{now.year % 100:02d}{(now.year + 1) % 100:02d}']

          print(f'Seasons: {seasons}')
          print(f'Leagues: {len(leagues)}')

          total = 0
          for lg in leagues:
              cnt = cmd('ZCARD', f'history:league:{lg}')
              if cnt and int(cnt) > 0:
                  print(f'  history:league:{lg}: {cnt} matches')
                  total += int(cnt)
          print(f'Total matches across leagues: {total}')

          meta_raw = cmd('GET', 'football_data:meta')
          if meta_raw:
              try:
                  meta_all = json.loads(meta_raw)
                  for field, m in meta_all.items():
                      if isinstance(m, dict):
                          print(f'  meta {field}: stored={m.get("stored_matches", m.get("matches"))}, '
                                f'errors={m.get("error_count", m.get("errors"))}, '
                                f'last={str(m.get("last_run_at", m.get("last_run", "")))[:19]}')
              except (json.JSONDecodeError, TypeError) as e:
                  print(f'  meta: parse error: {e}')
          else:
              print('  meta: not found')

          first = None
          if 'E0' in leagues:
              first = cmd('ZRANGE', 'history:league:E0', 0, 0)
          elif leagues:
              first = cmd('ZRANGE', f'history:league:{leagues[0]}', 0, 0)

          if first and isinstance(first, list) and first:
              cid = first[0]
              data = cmd('GET', f'history:match:{cid}')
              if data:
                  try:
                      m = json.loads(data)
                  except (json.JSONDecodeError, TypeError):
                      m = None

                  if m:
                      print(f'First match: {m.get("home_team")} vs {m.get("away_team")}')
                      print(f'  CID: {cid}')
                      print(f'  home_clean: {m.get("home_clean")}')
                      print(f'  Date UTC: {m.get("date_utc")}')
                      print(f'  Schema version: {m.get("schema_version")}')
                      print(f'  Season: {m.get("season")}')

                      # FIX-6: Verify odds are float (not str)
                      odds = m.get('odds', {}).get('1x2', {})
                      current = odds.get('current', {})
                      if current:
                          h = current.get('home')
                          print(f'  Odds home type: {type(h).__name__} = {h}')
                          if isinstance(h, str):
                              print('  WARNING: odds are str, expected float (Schema v710)')

                      if LIMIT == '1':
                          print()
                          print('--- FULL PAYLOAD DUMP (limit=1) ---')
                          full = json.dumps(m, indent=2, ensure_ascii=False)
                          chunk = 4000
                          for i in range(0, len(full), chunk):
                              print(full[i:i+chunk])
              else:
                  print(f'  First match: GET history:match:{cid} returned nil')
          elif total == 0:
              print('WARNING: NO MATCHES FOUND')

          print()
          print('=== Verify Done ===')
          "

      - name: Summary
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Football Data Loader Summary ==="
          echo "Seasons: ${SEASONS_INPUT:-auto}"
          echo "Leagues: ${LEAGUES_INPUT:-all 22}"
          echo "History days: ${HISTORY_DAYS_INPUT}"
          echo "Limit: ${LIMIT_INPUT}"
          echo "Dry run: ${DRY_RUN_INPUT}"
          echo "Flush: ${FLUSH_INPUT}"
          echo ""
          if [ -n "${{ github.run_id }}" ]; then
            echo "Run ID: ${{ github.run_id }}"
            echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
