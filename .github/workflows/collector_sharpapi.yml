name: Collector SharpAPI

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Дней вперёд'
        required: false
        default: '3'
      max_pages:
        description: 'Макс. страниц API (full scan)'
        required: false
        default: '60'
      limit:
        description: 'Лимит матчей на страницу'
        required: false
        default: '200'
      use_delta:
        description: 'Использовать delta endpoint (1=да, 0=нет)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: collector-sharpapi
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  GK_CONFIG_FILE: 'gatekeeper_config.yaml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run SharpAPI collector
        run: python collector_sharpapi.py
        env:
          SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY || '' }}
          SHARPAPI_RATE_LIMIT_DELAY: '5'
          SHARPAPI_MAX_PAGES: ${{ github.event.inputs.max_pages || '60' }}
          SHARPAPI_LIMIT: ${{ github.event.inputs.limit || '200' }}
          SHARPAPI_DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '3' }}
          SHARPAPI_USE_DELTA: ${{ github.event.inputs.use_delta || '1' }}
          SHARPAPI_HTTP_TIMEOUT: '15'
          SHARPAPI_MAX_RETRIES: '2'
          GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}

      - name: Summary
        if: always()
        run: |
          echo "=== SharpAPI Collector Summary ==="
          echo "Days ahead: ${{ github.event.inputs.days_ahead || '3' }}"
          echo "Max pages: ${{ github.event.inputs.max_pages || '60' }}"
          echo "Delta: ${{ github.event.inputs.use_delta || '1' }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          MSG="❌ SharpAPI Collector FAILED%0A%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="${MSG}" || true
