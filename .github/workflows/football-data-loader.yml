name: Football Data Loader

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Сезоны через запятую (пусто = авто)'
        required: false
        default: '2526'
      leagues:
        description: 'Лиги через запятую (пусто = все 22)'
        required: false
        default: ''
      history_days:
        description: 'Окно истории в днях (0 = весь CSV)'
        required: false
        default: '0'

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SEASONS_INPUT: ${{ github.event.inputs.seasons }}
      LEAGUES_INPUT: ${{ github.event.inputs.leagues }}
      HISTORY_DAYS_INPUT: ${{ github.event.inputs.history_days }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Football Data Collector
        run: |
          python football_data_to_redis.py             --seasons "${SEASONS_INPUT}"             --leagues "${LEAGUES_INPUT}"             --history-days ${HISTORY_DAYS_INPUT}

      - name: Summary
        if: always()
        run: |
          echo "=== Football Data Loader Summary ==="
          echo "Seasons: ${SEASONS_INPUT}"
          echo "Leagues: ${LEAGUES_INPUT}"
          echo "History days: ${HISTORY_DAYS_INPUT}"
          
