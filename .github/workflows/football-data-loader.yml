name: Football Data Loader

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Сезоны через запятую (пусто = авто)'
        required: false
        default: '2526'
      leagues:
        description: 'Лиги через запятую (пусто = все 22)'
        required: false
        default: ''
      history_days:
        description: 'Окно истории в днях (0 = весь CSV)'
        required: false
        default: '0'

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SEASONS_INPUT: ${{ github.event.inputs.seasons }}
      LEAGUES_INPUT: ${{ github.event.inputs.leagues }}
      HISTORY_DAYS_INPUT: ${{ github.event.inputs.history_days }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Football Data Collector
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u football_data_to_redis.py \
            --seasons "${SEASONS_INPUT}" \
            --leagues "${LEAGUES_INPUT}" \
            --history-days ${HISTORY_DAYS_INPUT}

      - name: Verify Redis data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          import os, json, urllib.request
          URL = os.environ['UPSTASH_REDIS_REST_URL']
          TOKEN = os.environ['UPSTASH_REDIS_REST_TOKEN']
          def cmd(*args):
              req = urllib.request.Request(URL, data=json.dumps(list(args)).encode(),
                  headers={'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.loads(r.read()).get('result')
          print('=== Redis Verify (v5.0) ===')
          dbsize = cmd('DBSIZE')
          print(f'DBSIZE: {dbsize}')
          leagues = '${LEAGUES_INPUT}'.split(',') if '${LEAGUES_INPUT}' else []
          if not leagues:
              leagues = ['E0','E1','E2','E3','EC','SC0','SC1','SC2','SC3','D1','D2','I1','I2','SP1','SP2','F1','F2','N1','B1','P1','T1','G1']
          seasons = '${SEASONS_INPUT}'.split(',') if '${SEASONS_INPUT}' else []
          if not seasons:
              from datetime import datetime, timezone
              now = datetime.now(timezone.utc)
              seasons = [f'{now.year % 100:02d}{(now.year + 1) % 100:02d}']
          total = 0
          for lg in leagues:
              cnt = cmd('ZCARD', f'history:league:{lg}')
              if cnt and cnt > 0:
                  print(f'  history:league:{lg}: {cnt} matches')
                  total += cnt
          print(f'Total matches across leagues: {total}')
          for s in seasons:
              for lg in leagues:
                  meta = cmd('HGET', 'football_data:meta', f'{s}_{lg}')
                  if meta:
                      m = json.loads(meta)
                      print(f'  meta {s}_{lg}: matches={m.get(\"matches\")}, errors={m.get(\"errors\")}')
          first = cmd('ZRANGE', 'history:league:E0', 0, 0) if 'E0' in leagues else None
          if first:
              data = cmd('HGET', f'history:match:{first[0]}', 'data')
              if data:
                  m = json.loads(data)
                  print(f'First match: {m[\"home_team\"]} vs {m[\"away_team\"]}')
                  print(f'  Score: {m[\"score\"]}')
                  print(f'  Half-time result: {m.get(\"half_time_result\")}')
                  print(f'  Best odds: {m.get(\"odds\",{}).get(\"1x2\",{}).get(\"best\")}')
                  print(f'  Odds sources: {len(m.get(\"odds\",{}).get(\"1x2\",{}).get(\"sources\",[]))} entry(s)')
                  print(f'  Stats._source: {m.get(\"stats\",{}).get(\"_source\")}')
                  print(f'  Stats._updated_at: {m.get(\"stats\",{}).get(\"_updated_at\")}')
                  print(f'  Source_map.odds.independent: {m.get(\"source_map\",{}).get(\"odds\",{}).get(\"independent\")}')
                  print(f'  Source_map.odds.timestamp: {m.get(\"source_map\",{}).get(\"odds\",{}).get(\"timestamp\")}')
                  print(f'  Form: {m.get(\"form\")}')
                  print(f'  Ratings: {m.get(\"ratings\")}')
                  print(f'  Context: {m.get(\"context\")}')
                  print(f'  Created_at: {m.get(\"created_at\")}')
                  print(f'  Updated_at: {m.get(\"updated_at\")}')
                  print(f'  Schema_version: {m.get(\"schema_version\")}')
                  print(f'  Total payload fields: {len(m)}')
          elif total == 0:
              print('WARNING: NO MATCHES FOUND — data not written to Redis')
          print('=== Verify Done ===')
          "

      - name: Summary
        if: always()
        run: |
          echo "=== Football Data Loader Summary ==="
          echo "Seasons: ${SEASONS_INPUT}"
          echo "Leagues: ${LEAGUES_INPUT}"
          echo "History days: ${HISTORY_DAYS_INPUT}"
          
