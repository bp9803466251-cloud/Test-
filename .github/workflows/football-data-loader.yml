name: Football Data Loader

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Сезоны через запятую (напр. 2425,2526). Пусто = авто (2627)'
        required: false
        default: '2526'
      leagues:
        description: 'Лиги через запятую (напр. E0,E1,SP1). Пусто = все 22'
        required: false
        default: ''
      history_days:
        description: 'Окно истории в днях (0 = весь CSV без фильтра)'
        required: false
        default: '0'

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install redis

      - name: Run Football Data Collector
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}
        run: |
          python football_data_to_redis.py \
            --seasons "${{ github.event.inputs.seasons }}" \
            --leagues "${{ github.event.inputs.leagues }}" \
            --history-days ${{ github.event.inputs.history_days }}

      - name: Show summary
        if: always()
        run: |
          echo "=== Football Data Loader Summary ==="
          echo "Seasons: ${{ github.event.inputs.seasons }}"
          echo "Leagues: ${{ github.event.inputs.leagues || 'all 22' }}"
          echo "History days: ${{ github.event.inputs.history_days }}"
          
