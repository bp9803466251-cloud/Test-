name: Football Data Loader

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Сезон (напр. 2024 — пусто = текущий)'
        required: false
        default: ''
      history_days:
        description: 'Дней истории (по умолчанию 30)'
        required: false
        default: '30'
      rate_delay:
        description: 'Задержка между запросами (сек)'
        required: false
        default: '0.15'

jobs:
  load-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt 2>/dev/null || true
          pip install -q redis 2>/dev/null || true

      - name: Run football_data_to_redis.py
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FOOTBALL_DATA_SEASON: ${{ github.event.inputs.season }}
          FOOTBALL_DATA_HISTORY_DAYS: ${{ github.event.inputs.history_days }}
          FOOTBALL_DATA_RATE_DELAY: ${{ github.event.inputs.rate_delay }}
        run: python football_data_to_redis.py

      - name: Run seasons_check.py
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python seasons_check.py
        
