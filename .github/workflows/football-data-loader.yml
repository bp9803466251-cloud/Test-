name: Football Data Loader

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Сезон (оставьте пустым для текущего)'
        required: false
        default: ''
      history_days:
        description: 'Количество дней истории'
        required: false
        default: '30'
      rate_delay:
        description: 'Задержка между запросами (сек)'
        required: false
        default: '0.15'

jobs:
  load-football-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set environment variables
        run: |
          echo "FOOTBALL_DATA_API_KEY=${{ secrets.FOOTBALL_DATA_API_KEY }}" >> $GITHUB_ENV
          echo "FOOTBALL_DATA_SEASON=${{ inputs.season }}" >> $GITHUB_ENV
          echo "FOOTBALL_DATA_HISTORY_DAYS=${{ inputs.history_days }}" >> $GITHUB_ENV
          echo "FOOTBALL_DATA_RATE_DELAY=${{ inputs.rate_delay }}" >> $GITHUB_ENV

      - name: Run Football Data Collector
        run: |
          python football_data_to_redis.py

      - name: Run Seasons Check
        run: |
          python seasons_check.py
          
