name: Telegram Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatekeeper-redis
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  GK_CONFIG_FILE: 'gatekeeper_config.yaml'

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Send Telegram dashboard
        run: |
          python -c "
          from redis_hub import is_redis_configured, get_from_cache
          from gatekeeper_hub import get_all_matches
          from metrics import collect_metrics, save_metrics
          from telegram_transport import send_telegram_dashboard

          redis_ok = is_redis_configured()

          live_count = 0
          if redis_ok:
              try:
                  matches = get_all_matches()
                  live_count = len(matches) if matches else 0
              except Exception:
                  live_count = 0

          metrics = collect_metrics()

          stats = {
              'redis_available': redis_ok,
              'total_input': live_count,
              'time': metrics.get('timestamp', ''),
              'last_module': 'dashboard'
          }

          try:
              save_metrics(stats)
          except Exception:
              pass

          dashboard = str(stats)
          send_telegram_dashboard(dashboard)
          "
        env:
          SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          GATEKEEPER_ENV: prod
          GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          MSG="❌ Telegram Dashboard FAILED%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="${MSG}" || true
