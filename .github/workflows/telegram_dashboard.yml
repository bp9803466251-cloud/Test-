name: Telegram Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatekeeper-redis
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  GATEKEEPER_CONFIG_FILE: 'gatekeeper_config.yaml' # Синхронизировано с gatekeeper_config.py

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Mathematics & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Принудительное развертывание математического стека для предотвращения ModuleNotFoundError
          pip install numpy scipy

      - name: Broadcast Environment Health Metrics
        run: |
          python -c "
          import json
          from redis_config import is_redis_configured
          from gatekeeper_hub import get_all_matches
          from metrics import collect_metrics, save_metrics
          from telegram_transport import send_telegram_dashboard

          redis_ok = is_redis_configured()
          
          # Сбор системной канонической матрицы здоровья экосистемы
          metrics_payload = collect_metrics()
          save_metrics(metrics_payload)

          # Рендеринг текстовой строки отчета по правилу TOKEN CONTROL (§4)
          now_str = metrics_payload.get('timestamp', '?')
          report_text = (
              f'📊 <b>GatekeeperAI System Status Dashboard</b>\n'
              f'• Извлечено пре-матч паспортов: {metrics_payload.get(\"matches_total\", 0)}\n'
              f'• Доступность Redis Cluster: {\"✅ ONLINE\" if redis_ok else \"❌ OFFLINE\"}\n'
              f'• Активных Serverless-коллекторов: {metrics_payload.get(\"collectors_active\", 0)}\n'
              f'• Обнаружено сигналов VALUE BETS: {metrics_payload.get(\"matches_with_value\", 0)}\n\n'
              f'🕒 Временная метка генерации: {now_str}\n'
              f'⭐ Стандарт вычислений: CORE ENGINE V6.7'
          )
          
          send_telegram_dashboard(report_text)
          "
        env:
          SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          GATEKEEPER_ENV: prod
          GATEKEEPER_CONFIG_FILE: ${{ env.GATEKEEPER_CONFIG_FILE }}

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          MSG="❌ Telegram Dashboard FAILED%0ARun: ${{ github.run_id }}"
          curl -s -X POST "https://telegram.org{TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_GROUP_ID}" \
            -d text="${MSG}" || true
            
