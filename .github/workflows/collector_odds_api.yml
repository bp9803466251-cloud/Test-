name: Collector OddsAPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector-odds-api
  cancel-in-progress: false  # TODO: change to true after Phase 2 (idempotency_key)

env:
  PYTHON_VERSION: "3.12"
  GK_CONFIG_FILE: "gatekeeper_config.yaml"

jobs:
  collect:
    name: The Odds API V4
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
      SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_API_RATE_DELAY: "1.0"
      ODDS_API_MAX_RETRIES: "3"
      ODDS_API_REGIONS: "eu"
      ODDS_API_MARKETS: "h2h"
      ODDS_API_ODDS_FORMAT: "decimal"
      ODDS_API_DAYS_AHEAD: "3"
      GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector_odds_api
        run: python collector_odds_api.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oddsapi-failure-logs
          path: |
            *.log
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "=== Collector OddsAPI Summary ==="
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Status: SUCCESS"
          else
            echo "Status: ${{ job.status }}"
          fi
          
