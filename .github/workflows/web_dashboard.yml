name: Web Dashboard

on:
  workflow_dispatch:
    inputs:
      port:
        description: "Порт (default: 8080)"
        required: false
        default: '8080'
      duration:
        description: "Длительность работы (минуты, 0 = бессрочно)"
        required: false
        default: '30'

permissions:
  contents: read

concurrency:
  group: gatekeeper-redis  # FIX-AUDIT-v9.3: единая группа для предотвращения race condition
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  GK_CONFIG_FILE: 'gatekeeper_config.yaml'

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install ngrok
        run: |
          wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          tar -xzf ngrok-v3-stable-linux-amd64.tgz
          chmod +x ngrok

      - name: Start web dashboard
        env:
          SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL || '' }}
          SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN || '' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
          GK_CONFIG_FILE: ${{ env.GK_CONFIG_FILE }}
        run: |
          PORT=${{ github.event.inputs.port || '8080' }}
          DURATION=${{ github.event.inputs.duration || '30' }}

          # Запуск веб-панели в фоне
          python web_dashboard.py --port $PORT &
          DASHBOARD_PID=$!
          echo "Dashboard PID: $DASHBOARD_PID"

          # Ждём загрузки
          sleep 5

          # Запуск ngrok-туннеля (если токен задан)
          if [ -n "${{ secrets.NGROK_AUTH_TOKEN }}" ]; then
            ./ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
            ./ngrok http $PORT --log=stdout > ngrok.log 2>&1 &
            NGROK_PID=$!
            echo "Ngrok PID: $NGROK_PID"
            sleep 5

            # Получаем публичный URL
            PUBLIC_URL=$(curl -s http://localhost:4040/api/tunnels | python -c "import sys,json; print(json.load(sys.stdin)['tunnels'][0]['public_url'])" 2>/dev/null || echo "unknown")
            echo "::notice::Web Dashboard available at: $PUBLIC_URL"

            # Отправляем URL в Telegram
            if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
              TG_CHAT="${{ secrets.TELEGRAM_GROUP_ID }}"  # FIX-AUDIT-v9.3: прямой маппинг (Вариант B)
              MSG="🖥 <b>GatekeeperAI Monitor</b>%0AURL: $PUBLIC_URL%0APort: $PORT%0ADuration: ${DURATION}m%0A%0AAuto-refresh: 30s"
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d "chat_id=${TG_CHAT}" \
                -d "text=${MSG}" \
                -d "parse_mode=HTML" || true
            fi
          else
            echo "::notice::NGROK_AUTH_TOKEN not set. Dashboard running on localhost:$PORT"
          fi

          # Держим воркфлоу активным
          if [ "$DURATION" = "0" ]; then
            wait $DASHBOARD_PID
          else
            sleep $((DURATION * 60))
            kill $DASHBOARD_PID 2>/dev/null || true
          fi

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}  # FIX-AUDIT-v9.3: прямой маппинг (Вариант B)
        run: |
          MSG="🔴 <b>Web Dashboard FAILED</b>%0ARepo: ${{ github.repository }}%0ARun: ${{ github.run_id }}%0A%0A👉 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_GROUP_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" || true
            
