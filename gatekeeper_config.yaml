# ═══════════════════════════════════════════════════════════
# gatekeeper_config.yaml — Единая конфигурация GatekeeperAI
# Версия 8.11-patched | Schema v710 | Гайд §20.3
# Env-переменные остаются для секретов (API-ключи, Redis URL).
# Все настраиваемые параметры — здесь.
# ═══════════════════════════════════════════════════════════

# ── Коллекторы ─────────────────────────────────────────────
collectors:
  sharpapi:
    rate_delay: 1.0
    max_retries: 3
    timeout: 30
    max_pages: 5
    limit: 100
    days_ahead: 3
  odds_api:
    rate_delay: 0.5
    max_retries: 3
    regions: ["eu", "uk"]
    markets: ["h2h", "spreads", "totals"]
    odds_format: decimal
  bzzoiro:
    rate_delay: 2.0
    enrich_delay: 1.0
    max_retries: 5
    days_ahead: 3
  propline:
    rate_delay: 1.5
    max_retries: 3
  football_data:
    seasons: ["2425", "2526", "2627"]
    leagues: "all"
    pipeline_batch_size: 10
    history_days: 0
    limit: 0

# ── Redis ──────────────────────────────────────────────────
redis:
  read_timeout: 30
  write_timeout: 30
  pipeline_batch_size: 10
  circuit_breaker_threshold: 10
  circuit_breaker_reset: 60

# ── Очистка (§1.7) ────────────────────────────────────────
cleanup:
  match_ttl_hours: 2
  index_lookback_days: -2
  index_lookahead_days: 7
  auto_migrate: true

# ── Upstream map (§1.20) ───────────────────────────────────
# Заменяет хардкод UPSTREAM_MAP в гайде
upstream_map:
  sharpapi: betradar
  odds_api: betradar
  bzzoiro: opta
  propline: pinnacle
  football_data: bet365

# ── Value engine ──────────────────────────────────────────
value_engine:
  threshold: 0.03
  min_odds: 1.01
  max_odds: 1000.0

# ── Telegram ──────────────────────────────────────────────
telegram:
  dashboard_interval_hours: 1
  alert_on_failure: true

# ── Logging (§20.6 — планируется) ──────────────────────────
logging:
  level: INFO
  structured: false  # true после внедрения log_event()
  safe_mode: true    # §1.23: без payloads в логах
