# gatekeeper_config.yaml — Единая конфигурация GatekeeperAI (§20.3)
# Env-переменные остаются для секретов (API-ключи, Redis URL).
# Все настраиваемые параметры — здесь.

collectors:
  sharpapi:
    rate_delay: 1.0
    max_retries: 3
    timeout: 30
    max_pages: 5
  odds_api:
    rate_delay: 0.5
    max_retries: 3
    timeout: 30
    regions: ["eu", "uk"]
    markets: ["h2h", "spreads", "totals"]
    odds_format: "decimal"
  bzzoiro:
    rate_delay: 2.0
    enrich_delay: 1.0
    max_retries: 5
    timeout: 30
  propline:
    rate_delay: 1.5
    max_retries: 3
    timeout: 30

# §20.3: odds_priority импортируется из отдельного файла, не дублируется здесь
odds_priority: !include odds_priority.yaml

redis:
  read_timeout: 30
  write_timeout: 30
  pipeline_batch_size: 10
  circuit_breaker_threshold: 10
  circuit_breaker_reset: 60

cleanup:
  match_ttl_hours: 2
  index_lookback_days: -2
  index_lookahead_days: 7

features:
  graceful_shutdown: true      # §23.3 — is_shutdown_requested()
  auto_migrate: true            # §20.5 — cleanup_expired(auto_migrate=True)
  schema_validation: true       # §19.6 — validate_schema() перед записью

upstream_map:
  sharpapi: betradar
  odds_api: betradar
  bzzoiro: opta
  propline: pinnacle
  football_data: bet365
