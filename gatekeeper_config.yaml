# gatekeeper_config.yaml — Единая конфигурация GatekeeperAI (§20.3)
# Env-переменные остаются для секретов (API-ключи, Redis URL).
# Все настраиваемые параметры — здесь.

collectors:
  sharpapi:
    rate_delay: 1.0
    max_retries: 3
    timeout: 30
    max_pages: 5
  odds_api:
    rate_delay: 0.5
    max_retries: 3
    regions: ["eu", "uk"]
    markets: ["h2h", "spreads", "totals"]
    odds_format: "decimal"
  bzzoiro:
    rate_delay: 2.0
    enrich_delay: 1.0
    max_retries: 5
  propline:
    rate_delay: 1.5
    max_retries: 3

redis:
  read_timeout: 30
  write_timeout: 30
  pipeline_batch_size: 10
  circuit_breaker_threshold: 10
  circuit_breaker_reset: 60

cleanup:
  match_ttl_hours: 2
  index_lookback_days: -2
  index_lookahead_days: 7

features:
  graceful_shutdown: true
  auto_migrate: true
  schema_validation: true

upstream_map:
  sharpapi: betradar
  odds_api: betradar
  bzzoiro: opta
  propline: pinnacle
  football_data: bet365
