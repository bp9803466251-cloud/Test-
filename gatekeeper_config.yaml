schema_version: v710
pipeline_batch_size: 10
odds_priority:
  sharpapi: 1
  odds_api: 3
  propline: 6
  bzzoiro: 8
  football_data: 10
collector_time_windows:
  sharpapi:
    days_ahead: 3
    env: SHARPAPI_DAYS_AHEAD
  odds_api:
    days_ahead: 3
    env: ODDS_API_DAYS_AHEAD
  propline:
    days_ahead: 3
    env: PROPLINE_DAYS_AHEAD
  bzzoiro:
    days_ahead: 7
    env: BZZOIRO_DAYS_AHEAD
features:
  schema_validation:
    enabled: true
    level: strict
  audit_log:
    enabled: true
  provenance:
    enabled: true
  auto_migrate:
    enabled: false
  conflict_resolution:
    enabled: true
  idempotency_keys:
    enabled: true
  graceful_shutdown:
    enabled: true
  state_machine:
    enabled: true
  metrics:
    enabled: true
namespace:
  prefix: ''
  domains:
    football: ''
    basketball: basket
canary:
  enabled: false
  ttl_hours: 24
  cleanup_on_success: true
data_lineage:
  sharpapi:
    provides:
    - odds.1x2.current
    - odds.1x2.opening
    - odds.1x2.best
    consumed_by:
    - telegram_bot
    - analytics_pipeline
    - value_analysis
  odds_api:
    provides:
    - odds.1x2.current
    - odds.1x2.sources
    consumed_by:
    - telegram_bot
    - odds_aggregator
  bzzoiro:
    provides:
    - stats
    - predictions
    - h2h
    consumed_by:
    - telegram_bot
    - analytics_pipeline
    - xg_calculator
  propline:
    provides:
    - odds.1x2.opening
    - odds.closing_1x2
    consumed_by:
    - value_analysis
    - telegram_bot
  football_data:
    provides:
    - csv_raw
    - history.match
    consumed_by:
    - analytics_pipeline
    - model_training
shared_code:
  distribution: vendored
  source_repo: gatekeeper-shared
  pinned_version: v8.9
  auto_update: false
  files:
  - gatekeeper_hub.py
  - redis_hub.py
  - search_module.py
  - gatekeeper_config.yaml
orchestration:
  sequence:
  - name: sharpapi
    depends_on: []
  - name: odds_api
    depends_on: []
  - name: bzzoiro
    depends_on:
    - sharpapi
  - name: propline
    depends_on:
    - sharpapi
    - odds_api
  parallel_groups:
  - - sharpapi
    - odds_api
  cleanup_owner: sharpapi
environments:
  prod:
    redis_url_env: SHARED_UPSTASH_REDIS_REST_URL
    redis_token_env: SHARED_UPSTASH_REDIS_REST_TOKEN
    namespace_prefix: ''
    features:
      schema_validation:
        enabled: true
        level: strict
      audit_log:
        enabled: true
  staging:
    redis_url_env: STAGING_REDIS_URL
    redis_token_env: STAGING_REDIS_TOKEN
    namespace_prefix: staging
    features:
      schema_validation:
        enabled: true
        level: warn
      audit_log:
        enabled: false
  dev:
    redis_url_env: DEV_REDIS_URL
    redis_token_env: DEV_REDIS_TOKEN
    namespace_prefix: dev
    features:
      schema_validation:
        enabled: false
      audit_log:
        enabled: false
