# GatekeeperAI Configuration v9.3-audited
features:
  graceful_shutdown: true
  auto_migrate: true
  telegram_dashboard: true
  value_bets: true
  safe_mode: true

value_engine:
  value_threshold: 0.03
  warm_threshold: 0.015

collectors:
  sharpapi:
    rate_limit_delay: 6
    max_pages: 60
  odds_api:
    rate_delay: 1.0
  bzzoiro:
    rate_delay: 2.0
  propline:
    rate_delay: 1.5
  football_data:
    history_days: 0

redis:
  timeout: 30
  circuit_breaker_threshold: 10
  circuit_breaker_recovery: 60
  hash_name: GatekeeperAI
  max_pipeline: 10

telegram:
  chunk_limit: 4000
  max_retries: 3

upstream_map:
  sharpapi: betradar
  odds_api: betradar
  bzzoiro: opta
  propline: pinnacle
  football_data: bet365
