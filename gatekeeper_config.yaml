# gatekeeper_config.yaml — Конфигурация GatekeeperAI (§20.3)
# v9.3-audited
# Env-переменные — только для секретов (API-ключи, Redis URL).

version: "9.3-audited"

# Feature flags
features:
  graceful_shutdown: true
  auto_migrate: true
  telegram_dashboard: true
  value_bets: true
  safe_mode: true

# Value Engine
value_engine:
  value_threshold: 0.03
  hot_threshold: 0.05
  warm_threshold: 0.03
  min_history_matches: 5
  max_history_matches: 50

# Upstream map (§1.20)
upstream_map:
  sharpapi: betradar
  odds_api: betradar
  bzzoiro: opta
  propline: pinnacle
  football_data: multi_bookmaker

# Collectors
collectors:
  sharpapi:
    rate_limit_delay: 6
    max_pages: 60
    limit: 200
    days_ahead: 3
    max_retries: 3
  odds_api:
    rate_delay: 1.0
    regions: "eu,uk"
    markets: "h2h"
    odds_format: "decimal"
    max_retries: 1
  bzzoiro:
    rate_delay: 2.0
    enrich_delay: 1.0
    max_retries: 5
  propline:
    rate_delay: 1.5
  football_data:
    history_days: 0

# Cleanup
cleanup:
  enabled: true
  max_age_hours: 48
  dry_run_default: true

# Redis
redis:
  timeout: 30
  circuit_breaker:
    failure_threshold: 10
    recovery_timeout: 60
  hash_name: GatekeeperAI
  max_pipeline: 10

# Telegram
telegram:
  dashboard_enabled: true
  alert_on_failure: true
