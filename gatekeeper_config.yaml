# GatekeeperAI v8.11-patched — Configuration (§20.3)
version: "v811"

# Pipeline settings
pipeline_batch_size: 50
index_lookback_days: 2
index_lookahead_days: 3

# Feature flags
features:
  graceful_shutdown: true
  auto_migrate: true
  telegram_dashboard: true
  value_bets: true
  safe_mode: true

# Collector upstream mapping (§19.2)
collector_upstream:
  sharpapi: betradar
  odds_api: betradar
  bzzoiro: opta
  propline: pinnacle
  football_data: bet365

# Value engine
value_threshold: 0.03

# Cleanup settings
cleanup:
  enabled: true
  dry_run: false
  auto_migrate: true
  expire_seconds: 86400

# Redis settings (env-based, these are defaults)
redis:
  timeout: 30
  hash_name: GatekeeperAI
  max_pipeline: 50

# Circuit breaker (§1.9)
circuit_breaker:
  failure_threshold: 10
  recovery_timeout: 60
