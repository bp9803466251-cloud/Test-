# GatekeeperAI v8.11-patched — Configuration (§20.3)
# FIX-AUDIT-v9.3: collector_upstream → upstream_map, value_threshold → value_engine.threshold
version: "v9.3"

# Pipeline settings
pipeline_batch_size: 50
index_lookback_days: 2
index_lookahead_days: 3

# Feature flags
features:
  graceful_shutdown: true
  auto_migrate: true
  telegram_dashboard: true
  value_bets: true
  safe_mode: true

# FIX-AUDIT-v9.3: upstream_map (was collector_upstream) — соответствует гайду §20.3
upstream_map:
  sharpapi: betradar
  odds_api: betradar
  bzzoiro: opta
  propline: pinnacle
  football_data: bet365

# FIX-AUDIT-v9.3: value_threshold перемещён в value_engine — соответствует гайду §20.3
value_engine:
  threshold: 0.03

# Cleanup settings
cleanup:
  enabled: true
  dry_run: false
  auto_migrate: true
  expire_seconds: 86400

# Redis settings (env-based, these are defaults)
redis:
  timeout: 30
  hash_name: GatekeeperAI
  max_pipeline: 50

# Circuit breaker (§1.9)
circuit_breaker:
  failure_threshold: 10
  recovery_timeout: 60
  
