name: Season Diagnostics

on:
  workflow_dispatch:  # Запуск по требованию
  schedule:
    - cron: '0 0 * * *'  # Ежедневно в полночь (можно убрать, если не нужно)

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Таймаут на случай зависаний

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'  # Версия Python из вашего окружения

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Если есть зависимости

    - name: Run Season Check
      env:
        UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        SHARED_UPSTASH_REDIS_REST_URL: ${{ secrets.SHARED_UPSTASH_REDIS_REST_URL }}
        SHARED_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.SHARED_UPSTASH_REDIS_REST_TOKEN }}
      run: |
        python seasons_check.py

    - name: Upload logs
      uses: actions/upload-artifact@v3
      with:
        name: season-diagnostics-logs
        path: logs/  # Если скрипт создает логи
        
