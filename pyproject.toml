[tool.poetry]
name = "match-processing"
version = "0.1.0"
description = "Система обработки и валидации спортивных матчей"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"

# Базовые зависимости
python-dotenv = "^0.21.0"

# Работа с Redis
redis = "^4.5.4"

# Внешние API
curl-cffi = ">=0.7.0"

# Конфигурация и сериализация
PyYAML = ">=6.0"

# Тестирование
pytest = "^7.4.3"
pytest-mock = "^3.10.0"
pytest-asyncio = "^0.28.0"

# Валидация и схема
jsonschema = "^4.19.0"

# Мониторинг
prometheus_client = "^0.18.0"
python-json-logger = "^2.0.7"
statsd = "^4.0.2"

# Дополнительные утилиты
requests = "^2.31.0"
aiohttp = "^3.9.4"

# Разработка
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.4.1"

[tool.poetry.dev-dependencies]
# Дополнительные зависимости для разработки

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--verbose --html=test-reports/report.html --self-contained-html"
