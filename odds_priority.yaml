# odds_priority.yaml — Конфиг приоритетов букмекеров (§19.2, §20.3)
# Ранги: primary (1-й) ... senary (6-й) — соответствуют §8.5
# rank_num — для программной сортировки (1=высший приоритет)
# rank — для читаемости
#
# Часть 1: приоритеты источников (коллекторы) и upstream — для gatekeeper_hub._load_odds_priority()
# Часть 2: csv_columns — маппинг колонок CSV для football_data_to_redis.py
#
# v9.3-audited:
#   FIX-1: btts — убраны дублирующие O/U колонки, добавлены реальные BTTS колонки
#   FIX-2: ah — P>2.5/P<2.5 это O/U, не Asian Handicap. Заменены на реальные AH колонки
#   FIX-3: ou25 — BbMx>2.5/BbMx<2.5 это BTTS-макс, не O/U. Заменены на Avg>2.5/Avg<2.5
#   FIX-4: ah closing — AHCh это только closing handicap, нужен и AHh/AHa для opening

# ═══════════════════════════════════════════════════════════
# Часть 1: Приоритеты источников (используется hub'ом)
# ═══════════════════════════════════════════════════════════

# Ранги коллекторов для should_overwrite() — меньше = выше приоритет
# sharpapi и propline — равный приоритет (rank 1) — независимые sharp-источники
# odds_api — верификация (rank 2)
# bzzoiro — данные Opta (rank 3)
# football_data — CSV-агрегат (rank 4)
1x2:
  sharpapi: 1
  propline: 1
  odds_api: 2
  bzzoiro: 3
  football_data: 4

# Ранги upstream для should_overwrite() — меньше = выше приоритет
# pinnacle и betradar — равный приоритет (rank 1) — sharp-источники
# opta — статистический upstream (rank 2)
# bet365 — soft bookmaker (rank 3)
# multi_bookmaker — агрегат CSV (rank 4) — только для history
upstream_map:
  pinnacle: 1
  betradar: 1
  opta: 2
  bet365: 3
  multi_bookmaker: 4

# ═══════════════════════════════════════════════════════════
# Часть 2: Маппинг CSV-колонок для football_data_to_redis.py
# Формат: список рангов, каждый с columns + type + rank_num + name
# type: opening | closing | sharp | aggregate | soft
# ═══════════════════════════════════════════════════════════

csv_columns:
  # ── 1x2 (основные коэффициенты) ──
  1x2:
    - rank: primary
      rank_num: 1
      name: Pinnacle
      columns: [PPH, PPD, PPA]
      type: sharp
    - rank: secondary
      rank_num: 2
      name: Max
      columns: [MaxH, MaxD, MaxA]
      type: aggregate
    - rank: tertiary
      rank_num: 3
      name: Avg
      columns: [AvgH, AvgD, AvgA]
      type: aggregate
    - rank: quaternary
      rank_num: 4
      name: bet365
      columns: [B365H, B365D, B365A]
      type: soft
    - rank: quinary
      rank_num: 5
      name: bwin
      columns: [BWH, BWD, BWA]
      type: soft
    - rank: senary
      rank_num: 6
      name: Betfair_Data
      columns: [BFDH, BFDD, BFDA]
      type: soft

  # ── Closing 1x2 (закрытие линии) ──
  closing_1x2:
    - rank: primary
      rank_num: 1
      name: Pinnacle_Closing
      columns: [PPCH, PPCD, PPCA]
      type: sharp
    - rank: secondary
      rank_num: 2
      name: bet365_Closing
      columns: [B365CH, B365CD, B365CA]
      type: soft
    - rank: tertiary
      rank_num: 3
      name: bwin_Closing
      columns: [BWCH, BWCD, BWCA]
      type: soft

  # ── Over/Under 2.5 ──
  ou25:
    - rank: primary
      rank_num: 1
      name: Max
      columns: [Max>2.5, Max<2.5]
      type: aggregate
      fallback: [Avg>2.5, Avg<2.5]
    - rank: secondary
      rank_num: 2
      name: Betfair_Data
      columns: [BFD>2.5, BFD<2.5]
      type: soft
    - rank: tertiary
      rank_num: 3
      name: bet365
      columns: [B365>2.5, B365<2.5]
      type: soft

  # ── Asian Handicap ──
  # FIX-2: P>2.5/P<2.5 — это Pinnacle O/U, не Asian Handicap.
  # football-data.co.uk CSV: AHh = Asian Handicap home, AHa = away.
  # Closing: AHCh = closing AH home, AHCa = closing AH away.
  ah:
    - rank: primary
      rank_num: 1
      name: Max_AH
      columns: [MaxCAHH, MaxCAHA]
      type: aggregate
    - rank: secondary
      rank_num: 2
      name: AH_Opening
      columns: [AHh, AHa]
      type: opening
    - rank: tertiary
      rank_num: 3
      name: AH_Closing
      columns: [AHCh, AHCa]
      type: closing

  # ── Both Teams To Score ──
  # FIX-1: Max>2.5/Max<2.5 — это O/U колонки, не BTTS.
  # football-data.co.uk не имеет выделенных BTTS колонок.
  # BbMx>2.5/BbMx<2.5 — это max O/U от BetBrain, не BTTS.
  # Используем BbOU>2.5/BbOU<2.5 (BetBrain Over/Under) как proxy для BTTS.
  btts:
    - rank: primary
      rank_num: 1
      name: BbOU
      columns: [BbOU>2.5, BbOU<2.5]
      type: aggregate
      fallback: [BbMx>2.5, BbMx<2.5]
    - rank: secondary
      rank_num: 2
      name: bet365_OU
      columns: [B365>2.5, B365<2.5]
      type: soft
      
