# odds_priority.yaml — Конфиг приоритетов букмекеров (§19.2, §20.3)
# Версия 9.6.1-audited — Полная синхронизация со шлюзом хаба и лимитами v9.4-bulk.

# ═══════════════════════════════════════════════════════════
# Часть 1: Приоритеты источников (используется hub'ом)
# ═══════════════════════════════════════════════════════════

# Ранги коллекторов для should_overwrite() — меньше = выше приоритет
1x2:
  sharpapi: 1
  propline: 1
  odds_api: 2
  bzzoiro: 3
  football_data: 4

# Ранги upstream для should_overwrite() — меньше = выше приоритет
# Добавлен дублирующий ключ collector_upstream для жесткой совместимости с gatekeeper_config.py
upstream_map:
  pinnacle: 1
  betradar: 1
  opta: 2
  bet365: 3
  multi_bookmaker: 4

collector_upstream:
  pinnacle: 1
  betradar: 1
  opta: 2
  bet365: 3
  multi_bookmaker: 4

# ═══════════════════════════════════════════════════════════
# Часть 2: Маппинг CSV-колонок для football_data_to_redis.py
# ═══════════════════════════════════════════════════════════

csv_columns:
  # ── 1x2 (основные коэффициенты) ──
  1x2:
    - rank: primary
      rank_num: 1
      name: Pinnacle
      columns: [PPH, PPD, PPA]
      type: sharp
    - rank: secondary
      rank_num: 2
      name: Max
      columns: [MaxH, MaxD, MaxA]
      type: aggregate
    - rank: tertiary
      rank_num: 3
      name: Avg
      columns: [AvgH, AvgD, AvgA]
      type: aggregate
    - rank: quaternary
      rank_num: 4
      name: bet365
      columns: [B365H, B365D, B365A]
      type: soft
    - rank: quinary
      rank_num: 5
      name: bwin
      columns: [BWH, BWD, BWA]
      type: soft
    - rank: senary
      rank_num: 6
      name: Betfair_Data
      columns: [BFDH, BFDD, BFDA]
      type: soft

  # ── Closing 1x2 (закрытие линии) ──
  closing_1x2:
    - rank: primary
      rank_num: 1
      name: Pinnacle_Closing
      columns: [PPCH, PPCD, PPCA]
      type: sharp
    - rank: secondary
      rank_num: 2
      name: bet365_Closing
      columns: [B365CH, B365CD, B365CA]
      type: soft
    - rank: tertiary
      rank_num: 3
      name: bwin_Closing
      columns: [BWCH, BWCD, BWCA]
      type: soft

  # ── Over/Under 2.5 ──
  ou25:
    - rank: primary
      rank_num: 1
      name: Max
      columns: [Max>2.5, Max<2.5]
      type: aggregate
      fallback: [Avg>2.5, Avg<2.5]
    - rank: secondary
      rank_num: 2
      name: Betfair_Data
      columns: [BFD>2.5, BFD<2.5]
      type: soft
    - rank: tertiary
      rank_num: 3
      name: bet365
      columns: [B365>2.5, B365<2.5]
      type: soft

  # ── Asian Handicap ──
  ah:
    - rank: primary
      rank_num: 1
      name: Max_AH
      columns: [MaxCAHH, MaxCAHA]
      type: aggregate
    - rank: secondary
      rank_num: 2
      name: AH_Opening
      columns: [AHh, AHa]
      type: opening
    - rank: tertiary
      rank_num: 3
      name: AH_Closing
      columns: [AHCh, AHCa]
      type: closing

  # ── Both Teams To Score ──
  btts:
    - rank: primary
      rank_num: 1
      name: BbOU
      columns: [BbOU>2.5, BbOU<2.5]
      type: aggregate
      fallback: [BbMx>2.5, BbMx<2.5]
    - rank: secondary
      rank_num: 2
      name: bet365_OU
      columns: [B365>2.5, B365<2.5]
      type: soft
      
