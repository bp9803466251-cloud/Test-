# odds_priority.yaml — Конфиг приоритетов букмекеров (§19.2)
# Ранги: primary (1-й) ... senary (6-й)
# rank_num — для программной сортировки
# rank — для читаемости

1x2:
  sharpapi: 1
  propline: 1
  odds_api: 2
  bzzoiro: 3
  football_data: 4

upstream_map:
  pinnacle: 1
  betradar: 1
  opta: 2
  bet365: 3
  multi_bookmaker: 4

# Для CSV-источников (football_data_to_redis.py)
csv_columns:
  1x2:
    - rank: primary
      columns: [B365H, B365D, B365A]
      type: opening
    - rank: secondary
      columns: [BWH, BWD, BWA]
      type: opening
    - rank: tertiary
      columns: [IWH, IWD, IWA]
      type: opening
    - rank: quaternary
      columns: [PSH, PSD, PSA]
      type: closing
  ah:
    - rank: primary
      columns: [MaxCAHH, MaxCAHA]
    - rank: secondary
      columns: [AHCh]
      type: closing
  closing_1x2:
    - rank: primary
      columns: [PPCH, PPCD, PPCA]
      type: sharp
